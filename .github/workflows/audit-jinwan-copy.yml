name: Audit Jinwan player-facing copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-jinwan-copy.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan suspicious player-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('games/jinwan-youtao/index.html')
          s=p.read_text(encoding='utf-8')
          terms=['v5.','这版','玩家','测试','bug','BUG','提示词','聊天','小红书','继续修','我会','你说','你要','前期','后期','玩法','系统','功能','版本','开发','调试','快进时','不需要你','不再','改成','加入','接入','重做','修复','迭代','开放 4×','Day 1','Day 2','Day 3','Day 4','Day 5','Day 6','解锁路线','运营日志','目标依旧','渐进','新档','GM RUN']
          hits=[]
          for term in terms:
              pos=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  a=max(0,i-150); b=min(len(s),i+250)
                  snippet=s[a:b].replace('\n',' ')
                  hits.append((term,i,snippet))
                  pos=i+len(term)
          print('TOTAL HITS',len(hits))
          for term,i,snippet in hits[:250]:
              print('\n###',term,'@',i) 
              print(snippet)
          PY