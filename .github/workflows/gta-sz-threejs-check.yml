name: GTA SZ Three.js check

on:
  push:
    paths:
      - 'games/gta-sz-threejs/**'
      - '.github/workflows/gta-sz-threejs-check.yml'
  pull_request:
    paths:
      - 'games/gta-sz-threejs/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check modules
        run: |
          node --check games/gta-sz-threejs/city-runtime.js
          node --check games/gta-sz-threejs/game-v3.js
