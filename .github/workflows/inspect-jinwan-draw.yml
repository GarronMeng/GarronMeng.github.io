name: Inspect Jinwan draw code
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-jinwan-draw.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect speed and facade drawing
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('games/jinwan-youtao/index.html').read_text()
          for needle in ['function maxManualSpeed','facadeLv','propertyLevel(\'facade\')','strokeRect','strokeStyle']:
              print('\n###', needle)
              pos=0
              found=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  found+=1
                  print(s[max(0,i-500):min(len(s),i+1200)])
                  pos=i+len(needle)
                  if found>=8: break
              print('FOUND',found)
          PY