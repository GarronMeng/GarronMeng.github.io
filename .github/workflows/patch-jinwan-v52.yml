name: Patch Jinwan Youtao v5.2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-jinwan-v52.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch game UX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('games/jinwan-youtao/index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<title>今晚有套吗？ v5.1</title>','<title>今晚有套吗？ v5.2</title>',1)
          text=text.replace('<span class="versiontag">v5.0.1</span>','<span class="versiontag">v5.2</span>',1)
          text=text.replace('.speed button.on{background:var(--navy);color:#fff}', '.speed button.on{background:var(--navy);color:#fff}.speed button[disabled]{opacity:.32;filter:saturate(.35);cursor:not-allowed}',1)
          css=re.search(r'/\* compact daily settlement \*/.*?@media\(max-width:430px\)',text,re.S)
          if css:
              new='''/* actionable daily settlement */\n.settlecard{margin:8px 0 4px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px}.settlecard h4{margin:0 0 7px;font-size:10px;color:#655d55}.settlekpis{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:6px}.settlekpi{background:#f4efe8;border-radius:10px;padding:7px 8px}.settlekpi .kline{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.settlekpi b{font-size:12px;color:var(--ink)}.settlekpi small{font-size:7.5px;color:var(--muted)}.settlekpi .target{display:block;margin-top:2px;font-size:7px;color:#8a8178}.settlekpi.pass{background:#edf5ee}.settlekpi.fail{background:#fff0ed}.settleinsight{margin-top:8px;padding:8px 9px;border-radius:10px;background:#f8f5ef;border:1px solid #e6ddd2}.settleinsight strong{display:block;font-size:9px;color:#493f36}.settleinsight span{display:block;margin-top:3px;font-size:7.8px;line-height:1.45;color:#756c63}.historylist{margin-top:8px;border-top:1px solid #e7dfd5;padding-top:6px}.historyhead{display:flex;justify-content:space-between;font-size:7px;font-weight:900;color:#92877a;margin-bottom:3px}.historyrow{display:grid;grid-template-columns:34px 44px 1fr 54px;gap:5px;align-items:center;padding:4px 0;border-top:1px dashed #eee7de;font-size:7.2px;color:#6f675f}.historyrow:first-of-type{border-top:0}.historyrow b{font-size:7.4px;color:#4d4640}.historymeter{height:5px;background:#ece6de;border-radius:99px;overflow:hidden}.historymeter i{display:block;height:100%;background:#b6934f}.historymeter i.good{background:#63806a}.historymeter i.low{background:#a96b61}.visual3d .settlecard{background:#17242f;border-color:#364650}.visual3d .settlekpi{background:#22313c}.visual3d .settlekpi.pass{background:#20382d}.visual3d .settlekpi.fail{background:#3a2625}.visual3d .settlekpi b,.visual3d .settleinsight strong{color:#fff}.visual3d .settlekpi small,.visual3d .settlekpi .target,.visual3d .settleinsight span,.visual3d .historyrow,.visual3d .historyhead{color:#aeb8bf}.visual3d .settleinsight{background:#1d2b35;border-color:#34444f}.visual3d .historylist{border-color:#34444f}.visual3d .historyrow{border-color:#2d3b45}\n@media(max-width:430px)'''
              text=text[:css.start()]+new+text[css.end():]
          scene=re.search(r"var sceneAssets=\{.*?\};\nvar sceneMeta=",text,re.S)
