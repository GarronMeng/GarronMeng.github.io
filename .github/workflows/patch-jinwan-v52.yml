          text=text.replace("setTimeout(function(){spawnGuest('Globalist')},500);setTimeout(function(){spawnGuest()},1800)","setTimeout(function(){spawnGuest('Globalist')},900);setTimeout(function(){spawnGuest()},4200)",1)
          text=text.replace("你完成了 v5.1 的 GM 终局考核","你完成了 v5.2 的 GM 终局考核",1)
          text=text.replace("v5.1：加入多晚住客、周内/周末客流、空间开业反馈与运营日志。","v5.2：放慢前期节奏、修复日志关闭、重做高清 3D 场景与可行动结算复盘。",1)
          p.write_text(text,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          t=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          s=t.find('<script>(function(){');e=t.find('</script>',s)
          Path('/tmp/game.js').write_text(t[s+8:e],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v5.2
