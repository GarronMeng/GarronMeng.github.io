ilter="url(#d)"><path d="M180 420L855 355l68 680H132Z" fill="url(#g)"/><path d="M180 420l675-65-30 50-620 75Z" fill="#eee8df" opacity=".78"/></g><g stroke="#e0e7e9" stroke-width="5" opacity=".52"><path d="M205 545l680-36"/><path d="M205 610l685-36"/><path d="M205 675l690-36"/><path d="M205 740l695-36"/><path d="M205 805l700-36"/><path d="M205 870l705-36"/></g><rect x="370" y="875" width="320" height="160" rx="12" fill="#202a31" opacity=".74"/><rect x="400" y="905" width="260" height="105" rx="7" fill="'+c[3]+'" opacity=".72"/><circle cx="155" cy="1085" r="25" fill="'+c[3]+'"/><circle cx="910" cy="1080" r="18" fill="'+c[3]+'" opacity=".7"/></svg>'}
function sceneData(key){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(sceneSvg(key))}
var sceneAssets={place:sceneData('place'),regency:sceneData('regency'),grand:sceneData('grand'),andaz:sceneData('andaz'),alila:sceneData('alila'),park:sceneData('park')};
var sceneMeta='''
              text=text[:scene.start()]+block+text[scene.end():]
          for a,b in [
            ("cost:2500,need:5,rep:65","cost:2500,need:8,rep:65"),("cost:3800,need:10,rep:68","cost:3800,need:18,rep:68"),("cost:4500,need:14,rep:72","cost:4500,need:30,rep:72"),("cost:5600,need:18,rep:76","cost:5600,need:44,rep:76"),("cost:7500,need:22,rep:82","cost:7500,need:60,rep:82"),
            ("function challengeLevel(day){return Math.min(5,1+Math.floor((Math.max(1,day)-1)/3))}","function challengeLevel(day){return Math.min(5,1+Math.floor((Math.max(1,day)-1)/5))}"),
            ("spawn:[.032,.043,.054,.066,.078][lv]","spawn:[.026,.038,.050,.063,.076][lv]"),
            ("if(key==='space')return state.day>=2||state.stats.nights>=2;if(key==='ops')return state.day>=3||state.stats.nights>=3;if(key==='brand')return state.day>=4||state.stats.nights>=5","if(key==='space')return state.day>=2||state.stats.nights>=3;if(key==='ops')return state.day>=4||state.stats.nights>=8;if(key==='brand')return state.day>=6||state.stats.nights>=12"),
            ("if(key==='ops')return'Day 3 解锁运营';if(key==='brand')return'Day 4 解锁品牌'","if(key==='ops')return'Day 4 解锁运营';if(key==='brand')return'Day 6 解锁品牌'"),
            ("if(day===3&&!state.unlocksSeen.ops)","if(day===4&&!state.unlocksSeen.ops)"),("if(day===4&&!state.unlocksSeen.brand)","if(day===6&&!state.unlocksSeen.brand)"),
            ("['inventorySheet','opsSheet','portfolioSheet','reportSheet']","['inventorySheet','opsSheet','portfolioSheet','reportSheet','logSheet']"),
            ("if(n<5)return 0;if(n<12)return 1;if(n<22)return 2;if(n<34)return 3","if(n<8)return 0;if(n<20)return 1;if(n<36)return 2;if(n<56)return 3"),
            ("state.stats.nights===5","state.stats.nights===8"),("state.stats.nights===12","state.stats.nights===20"),("state.stats.nights===22","state.stats.nights===36"),("state.stats.nights===34","state.stats.nights===56"),("你已经接待 5 个房晚","你已经接待 8 个房晚")]:
              text=text.replace(a,b,1)
          sm=re.search(r"function settlementHtml\(report\)\{.*?\}\nfunction showMorningBriefing",text,re.S)
          if sm:
              fn=r'''function settlementAdvice(rep){var gaps=[];if((rep.revenue||0)<(rep.targetRevenue||0))gaps.push('营收差 ¥'+Math.max(0,(rep.targetRevenue||0)-(rep.revenue||0)));if((rep.nights||0)<(rep.targetNights||0))gaps.push('房晚差 '+Math.max(0,(rep.targetNights||0)-(rep.nights||0))+' 夜');if((rep.complaints||0)>1)gaps.push('客诉 '+rep.complaints+' 件');var why=gaps.length?gaps.slice(0,2).join(' · '):'四项核心指标基本守住',next='先守住可售房和前台队列';if((rep.nights||0)<(rep.targetNights||0))next='优先增加可售房 / 翻房能力，别让需求到了却没房卖';else if((rep.revenue||0)<(rep.targetRevenue||0))next='房晚够但营收不足：先看 ADR、升套和高价值客处理';else if((rep.rep||0)<65||(rep.complaints||0)>1)next='先修服务体验：减少 WALK、客诉和会员权益摩擦';else if((rep.owner||0)<65)next='先控成本和低效投入，再考虑继续扩张';else next='基础盘稳定，可以把钱投到空间升级或下一家店';return{why:why,next:next}}
function settlementHtml(report){var h=state.dailyHistory||[],recent=h.slice(Math.max(0,h.length-5)),rep=report||recent[recent.length-1]||{},adv=settlementAdvice(rep),rows='',i;if(!recent.length&&report)recent=[report];for(i=0;i<recent.length;i++){var d=recent[i],pct=d.targetRevenue?Math.round(d.revenue/d.targetRevenue*100):0,cls=d.score>=4?'good':d.score<=1?'low':'';pct=Math.max(0,Math.min(120,pct));rows+='<div class="historyrow"><b>D'+d.day+'</b><span>'+d.score+'/4</span><div class="historymeter"><i class="'+cls+'" style="width:'+Math.min(100,pct)+'%"></i></div><span>'+pct+'% · '+(d.complaints||0)+'诉</span></div>'}var metrics=[['营收','¥'+(rep.revenue||0),'目标 ¥'+(rep.targetRevenue||0),(rep.revenue||0)>=(rep.targetRevenue||0)],['房晚',rep.nights||0,'目标 '+(rep.targetNights||0)+' 夜',(rep.nights||0)>=(rep.targetNights||0)],['口碑',rep.rep||0,'目标 '+(rep.targetRep||65),(rep.rep||0)>=(rep.targetRep||65)],['业主',rep.owner||0,'目标 '+(rep.targetOwner||65),(rep.owner||0)>=(rep.targetOwner||65)]],k='',j;for(j=0;j<metrics.length;j++){var x=metrics[j];k+='<div class="settlekpi '+(x[3]?'pass':'fail')+'"><div class="kline"><b>'+x[1]+'</b><small>'+(x[3]?'✓ 达标':'△ 未达')+'</small></div><span class="target">'+x[0]+' · '+x[2]+'</span></div>'}return '<div class="settlecard"><h4>今日复盘 · 先看差在哪里</h4><div class="settlekpis">'+k+'</div><div class="settleinsight"><strong>今天的问题：'+adv.why+'</strong><span>明日优先：'+adv.next+'</span></div><div class="historylist"><div class="historyhead"><span>最近 '+recent.length+' 天</span><span>营收达成率 · 客诉</span></div>'+rows+'</div></div>'}
function showMorningBriefing'''
              text=text[:sm.start()]+fn+text[sm.end():]
          text=text.replace("targetNights:res.plan.nights,rep:Math.round(actualRep),owner:Math.round(actualOwner)","targetNights:res.plan.nights,targetRep:res.plan.rep,targetOwner:res.plan.owner,rep:Math.round(actualRep),owner:Math.round(actualOwner)",1)
          text=text.replace("function effectiveSpeed(){return autoNightActive()?8:state.speed}","function maxManualSpeed(){if(state.scenario&&state.scenario.active)return 4;if(state.day<2)return 1;if(state.day<5)return 2;return 4}\nfunction onboardingTimeRate(){if(state.scenario&&state.scenario.active)return 9;if(state.day===1)return 6.2;if(state.day===2)return 7.2;if(state.day===3)return 8;return 9}\nfunction onboardingDemandFactor(){if(state.scenario&&state.scenario.active)return 1;if(state.day===1)return .58;if(state.day===2)return .74;if(state.day===3)return .88;return 1}\nfunction effectiveSpeed(){return autoNightActive()?8:Math.min(state.speed,maxManualSpeed())}",1)
          text=text.replace("var mul=effectiveSpeed(),simMinutes=dt*mul*9;","var mul=effectiveSpeed(),simMinutes=dt*mul*onboardingTimeRate();",1)
          text=text.replace("Math.random()<dt*mul*diff.spawn*arrivalFactor","Math.random()<dt*mul*diff.spawn*arrivalFactor*onboardingDemandFactor()",1)
          text=text.replace("var nf=$('nightFast');if(nf){var active=autoNightActive();nf.classList.toggle('on',active);nf.textContent=active?'🌙 自动快进 8×':'🌙 22:00 后自动快进'}syncFeatureLocks();","var nf=$('nightFast');if(nf){var active=autoNightActive();nf.classList.toggle('on',active);nf.textContent=active?'🌙 自动快进 8×':'🌙 22:00 后自动快进'}var ms=maxManualSpeed();if(state.speed>ms)state.speed=ms;document.querySelectorAll('[data-speed]').forEach(function(sb){var v=parseInt(sb.getAttribute('data-speed'),10),locked=v>ms;sb.disabled=locked;sb.title=locked?(v===4?'Day 5 解锁 4×':'Day 2 解锁 2×'):'';sb.classList.toggle('on',v===state.speed)});syncFeatureLocks();",1)
          text=text.replace("document.querySelectorAll('[data-speed]').forEach(function(btn){btn.addEventListener('click',function(){state.speed=parseInt(btn.getAttribute('data-speed'),10);document.querySelectorAll('[data-speed]').forEach(function(x){x.classList.toggle('on',x===btn)});updateUI();saveState(true)})});","document.querySelectorAll('[data-speed]').forEach(function(btn){btn.addEventListener('click',function(){var v=parseInt(btn.getAttribute('data-speed'),10),ms=maxManualSpeed();if(v>ms){showToast(v===4?'🔒 Day 5 解锁 4×，先熟悉核心操作':'🔒 Day 2 解锁 2×，先把第一天跑明白');return}state.speed=v;document.querySelectorAll('[data-speed]').forEach(function(x){x.classList.toggle('on',x===btn)});updateUI();saveState(true)})});",1)
          text=text.replace("Day 2 解锁空间 · Day 3 解锁运营 · Day 4 解锁 Brand Explorer。","Day 2 解锁空间 · Day 4 解锁运营 · Day 6 解锁 Brand Explorer。\\n\\nDay 1 仅开放 1×，Day 2 解锁 2×，Day 5 才开放 4×。先把操作跑明白，再加速。",1)
