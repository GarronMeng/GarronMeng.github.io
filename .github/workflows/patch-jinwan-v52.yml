name: Patch Jinwan Youtao v5.2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-jinwan-v52.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch game
        run: python scripts/patch_jinwan_v52.py
      - name: Check JavaScript
        run: |
          python -c "from pathlib import Path; t=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8'); s=t.find('<script>(function(){'); e=t.find('</script>',s); Path('/tmp/game.js').write_text(t[s+8:e],encoding='utf-8')"
          node --check /tmp/game.js
      - name: Commit v5.2
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: Jinwan Youtao v5.2 UX pass [skip ci]'
          git push origin HEAD:master
