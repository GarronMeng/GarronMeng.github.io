name: Patch Jinwan Youtao v5.3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-jinwan-v53.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply v5.3 UX patch
        run: python scripts/patch-jinwan-v53.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'inline script missing'
          Path('/tmp/jinwan-v53.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/jinwan-v53.js
      - name: Commit game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: Jinwan Youtao v5.3 event and department pass [skip ci]'
          git push origin master
