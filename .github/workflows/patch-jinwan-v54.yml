name: Patch Jinwan Youtao v5.4
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-jinwan-v54.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5.4 balance patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('games/jinwan-youtao/index.html')
          text=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global text
              if old not in text:
                  raise SystemExit('missing '+label)
              text=text.replace(old,new,1)

          def replace_function(name,new_body):
              global text
              pat=r'function '+re.escape(name)+r'\([^\n]*?\)\{.*?(?=\nfunction \w+\()'
              text2,n=re.subn(pat,new_body,text,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit('function patch failed: '+name+' count='+str(n))
              text=text2

          text=text.replace('<title>今晚有套吗？ v5.3</title>','<title>今晚有套吗？ v5.4</title>',1)
          text=text.replace('GM Dashboard · v5.3','GM Dashboard · v5.4',1)
          text=text.replace('v5.3：新开档入口、稳定 3D、差异化事件 Playbook 与实质部门授权。','v5.4：口碑改为整数档位，负面冲击加入缓冲与单日上限，减少数值雪崩。',1)
          text=text.replace('你完成了 v5.3 的 GM 终局考核：','你完成了 v5.4 的 GM 终局考核：',1)
          text=text.replace('你完成了 v5.2 的 GM 终局考核：','你完成了 v5.4 的 GM 终局考核：',1)

          once('cash:7800,rep:63,owner:70','cash:7800,rep:68,owner:70','starting reputation')
          once('departmentImpact:{},streak:0','departmentImpact:{},balance54Applied:true,streak:0','balance migration flag')
          once("briefingDone:false,walks:0},lastDayReport","briefingDone:false,walks:0,repLoss:0},lastDayReport",'fresh daily repLoss')
          once("rep:[58,62,66,72,78][lv]+Math.min(intra,1)+t.repGoal","rep:[58,61,64,68,72][lv]+Math.min(intra,1)+t.repGoal",'daily rep target')

          needle="if(!state.departmentImpact)state.departmentImpact={};if(!state.stats)state.stats={};"
          once(needle,"if(!state.departmentImpact)state.departmentImpact={};if(!state.balance54Applied){state.rep=Math.max(50,Math.round(state.rep||0));state.owner=Math.round(state.owner||0);state.balance54Applied=true;}if(!state.stats)state.stats={};",'old save rescue')
          needle="if(typeof state.daily.walks!=='number')state.daily.walks=0;"
          once(needle,needle+"if(typeof state.daily.repLoss!=='number')state.daily.repLoss=0;",'ensure repLoss')

          old="function fmtImpact(n){n=Math.round(n*10)/10;return(String(n).replace('.0',''))}"
          helpers="""function reputationDailyCap(){if(state.scenario&&state.scenario.active)return 12;if(state.day<=3)return 4;if(state.day<=7)return 6;return 8}
          function repStep(n){if(!n)return 0;return Math.max(1,Math.round(Math.abs(n)))}
          function repPenalty(n){return Math.max(1,Math.min(4,Math.round(Math.abs(n)*.65)))}
          function repReward(n){return Math.max(1,Math.min(5,Math.round(Math.abs(n)*.8)))}
          function changeRep(delta){ensureDaily();if(!delta)return 0;var d=delta>0?repStep(delta):-repStep(delta);if(d<0){var cap=reputationDailyCap(),used=state.daily.repLoss||0,remain=Math.max(0,cap-used);if(remain<=0)return 0;var loss=Math.min(-d,remain);if(state.rep<35)loss=Math.min(loss,1);else if(state.rep<50)loss=Math.min(loss,2);d=-loss;state.daily.repLoss=used+loss}state.rep=Math.max(0,Math.min(100,state.rep+d));return d}
          function changeOwner(delta){if(!delta)return 0;var d=delta>0?repStep(delta):-repStep(delta);state.owner=Math.max(0,Math.min(100,state.owner+d));return d}
          function fmtImpact(n){return String(repStep(n))}"""
          once(old,helpers,'integer impact helpers')

          replace_function('autoFrontArrival',"function autoFrontArrival(gu){noteDepartment('front');var p=personaOf(gu),suite=state.rooms.filter(function(r){return r.type==='suite'&&!r.occupied&&!r.dirty&&!r.reserved})[0],pol=state.policies.front,occ=occupancy(),approve=false;if(suite){if(pol==='member')approve=suitesFree()>0;else if(pol==='yield')approve=suitesFree()>1&&occ<72;else approve=suitesFree()>1||occ<82}if(approve){state.stats.approved++;state.daily.approved++;changeRep(repReward(p.upgrade*.55));changeOwner(-1);assignRoom(gu,suite,true);recordAuto('Front Office 给普通 Globalist 升了 Standard Suite')}else{var loss=Math.max(1,p.deny*.28);markDenied(gu,p,loss,1);regularCheckin(gu);recordAuto('Front Office 按 '+policyName('front',pol)+' 处理了升套请求')}}")

          replace_function('autoFrontLate',"function autoFrontLate(gu){noteDepartment('front');var p=personaOf(gu),pol=state.policies.front,occ=occupancy(),honor=pol==='member'?occ<97:pol==='yield'?occ<72:occ<88;if(honor){gu.lateChoice='honor';state.stats.lateHonored++;changeRep(1);changeOwner(-1);recordAuto('4PM late checkout honored')}else{gu.lateChoice='deny';state.stats.lateDenied++;changeRep(-1);changeOwner(1);gu.grudge+=1;recordAuto('Front Office 协商为 14:00 退房')}}")

          replace_function('resolveDepartmentLead',"function resolveDepartmentLead(item,k){var v=vipDefs[item.key],req=executiveRequirements(item.key),sreq=vipSpaceRequirements(item.key),cover=departmentCoverage(req),scover=vipSpaceCoverage(item.key),support=cover+scover,relevant=req.indexOf(k)>=0,cost={front:140,house:130,revenue:90,fb:180,chef:150,events:170,engineering:160,wellness:180}[k]||150,need=Math.max(2,req.length+sreq.length-(item.level>=4?1:2)),success=relevant&&managerHired(k)&&support>=need;if(state.cash<cost){state.stats.vipFailed++;changeOwner(-1);showToast('⚠️ '+departmentDefs[k].name+' 想接，但现场预算不够。');return}state.cash-=cost;state.stats.totalExpense+=cost;noteDepartment(k);if(k==='engineering'||k==='house'){var rr=state.rooms.filter(function(r){return r.dirty&&!r.occupied})[0];if(rr){rr.dirty=false;rr.cleaning=0}}if(k==='fb'){state.breakfastStock=Math.min(100,state.breakfastStock+45);state.loungeStock=Math.min(100,state.loungeStock+45)}if(k==='revenue')recordRevenue(220+item.level*40);if(k==='events')recordRevenue(180+item.level*55);if(k==='wellness')recordRevenue(180+item.level*45);if(success){state.stats.vipResolved++;changeRep(item.level>=4?4:3);changeOwner(1);recordRevenue(140+item.level*70);state.daily.highlight='✅ '+v.icon+' '+v.name+'：'+departmentLeadLabel(k,item)+' 接住了事件。';showToast(state.daily.highlight)}else{state.stats.vipFailed++;changeRep(-2);changeOwner(-1);state.daily.highlight='⚠️ '+v.icon+' '+v.name+'：'+departmentLeadLabel(k,item)+' 只解决了局部，支持部门 / 空间仍不够。';showToast(state.daily.highlight)}}")

          replace_function('resolveExecutiveVip',"function resolveExecutiveVip(item,mode){var v=vipDefs[item.key],req=executiveRequirements(item.key),cover=departmentCoverage(req),need=req.length,sreq=vipSpaceRequirements(item.key),scover=vipSpaceCoverage(item.key),sneed=sreq.length,missing=Math.max(0,sneed-scover),success=false,msg='',cost;if(mode==='command'){cost=420+item.level*90+missing*140;if(state.cash<cost){changeOwner(-2);state.stats.vipFailed++;msg='预算不够，全酒店想帮也帮不动。业主 -2'}else if(missing>=2){state.cash-=cost;state.stats.totalExpense+=cost;changeRep(-2);state.stats.vipFailed++;msg='GM 可以催人，但不能现场变出两个缺失空间。硬拉通仍然翻车。'}else{state.cash-=cost;state.stats.totalExpense+=cost;changeRep(item.level>=4?5:4);changeOwner(1);state.stats.vipResolved++;recordRevenue(180+item.level*90);success=true;msg=missing?'GM 亲自补了最后一个空间短板，险过。':'GM 亲自拉通全部门，问题被完整解决。'}}else if(mode==='makeover'){cost=360+missing*240+item.level*40;if(state.cash<cost){changeOwner(-1);state.stats.vipFailed++;msg='临时改造预算没批下来。'}else{state.cash-=cost;state.stats.totalExpense+=cost;state.stats.emergencyMakeovers=(state.stats.emergencyMakeovers||0)+1;changeRep(item.level>=4?4:3);changeOwner(1);state.stats.vipResolved++;recordRevenue(150+item.level*80);success=true;msg='临时封层、布置、会客室转换和 Welcome Amenity 一起上，空间短板被临时补住。'}}else if(mode==='delegate'){var threshold=item.level>=4?need:Math.max(2,need-1),spaceThreshold=item.level>=4?sneed:Math.max(1,sneed-1);if(cover>=threshold&&scover>=spaceThreshold){changeRep(item.level>=4?4:3);changeOwner(2);state.stats.vipResolved++;recordRevenue(260+cover*110);success=true;msg='Leadership Team 和酒店硬件都接住了 VIP，GM 只需要签字。'}else{changeRep(item.level>=4?-4:-3);changeOwner(-2);state.stats.vipFailed++;msg=cover<threshold?'部门覆盖不足，SOP 在最需要它的时候失效了。':'空间没到位：团队很努力，但酒店物理条件不够。'}}else{recordRevenue(520+item.level*120);changeOwner(3);changeRep(item.level>=4?-4:-3);state.stats.vipFailed++;msg='Revenue 很漂亮，DP 也很精彩。'}if(item.key==='maintenance'&&success){changeRep(1);changeOwner(1);recordRevenue(120);msg+=' 可售房被及时救回，还顺手挽回了今晚收入。'}state.daily.highlight=(success?'✅ ':'⚠️ ')+v.icon+' '+v.name+'：'+msg;showToast(state.daily.highlight)}")

          replace_function('markDenied',"function markDenied(gu,p,loss,ownerGain){state.stats.denied++;state.daily.denied++;var hit=repPenalty(loss);changeRep(-hit);changeOwner(ownerGain||0);gu.denied=true;gu.grudge+=hit;if(Math.random()<p.app){gu.appWatch=true;state.daily.highlight=p.icon+' '+p.name+' 已经打开 App 再看一次套房库存。'}}")
          replace_function('complain',"function complain(msg,loss,gu){var mult=activeTheme().complaint;if(gu)mult*=personaOf(gu).service;var hit=repPenalty(loss*mult);state.stats.complaints++;state.daily.complaints++;changeRep(-hit);if(gu)gu.grudge+=hit;if(!state.daily.highlight)state.daily.highlight=msg;showToast(msg+' · 口碑 -'+hit)}")
          replace_function('walkedNoRoom',"function walkedNoRoom(gu){gu.phase='leave';gu.t=0;changeRep(-3);state.review='“到店说没房，但 App 上明明还在卖。” ★☆☆☆☆';state.stats.appStillSelling++;state.stats.complaints++;state.stats.walks++;state.daily.walks++;if(gu.profileKey)updateGuestMemory(gu);updateFeed();showToast('⚠️ WALK：App 上明明还在卖。口碑 -3')}")

          text=text.replace("impact:'👑 -0.5 · 🏢 +0.5'","impact:'👑 -1 · 🏢 +1'")
          text=text.replace("markDenied(gu,p,.5,.5)","markDenied(gu,p,1,1)")
          text=text.replace("impact:'💰 +¥260 · 👑 +1.5'","impact:'💰 +¥260 · 👑 +2'")
          text=text.replace("state.rep=Math.min(100,state.rep+1.5);regularCheckin(gu)","changeRep(2);regularCheckin(gu)")

          # Make visible front-desk tradeoffs match the new integer economy.
          text=text.replace("impact:'👑 +'+fmtImpact(p.upgrade)+' · 🏢 -2 · 🛋 -1'","impact:'👑 +'+repReward(p.upgrade)+' · 🏢 -2 · 🛋 -1'")
          text=text.replace("impact:'👑 -'+fmtImpact(p.deny)+' · 🏢 +1 · 🛋 保留'","impact:'👑 -'+repPenalty(p.deny)+' · 🏢 +1 · 🛋 保留'")
          text=text.replace("impact:'👑 -'+fmtImpact(p.deny*.55)+' · 🕓 风险延后'","impact:'👑 -'+repPenalty(p.deny*.55)+' · 🕓 风险延后'")
          text=text.replace("impact:'🎁 -1 · 👑 +'+fmtImpact(Math.max(1.4,p.upgrade*.62))+' · 🏢 ±0'","impact:'🎁 -1 · 👑 +'+repReward(Math.max(2,p.upgrade*.62))+' · 🏢 ±0'")
          text=text.replace("state.rep=Math.min(100,state.rep+p.upgrade);state.owner=Math.max(0,state.owner-2)","changeRep(repReward(p.upgrade));changeOwner(-2)")
          text=text.replace("state.rep=Math.min(100,state.rep+Math.max(1.4,p.upgrade*.62))","changeRep(repReward(Math.max(2,p.upgrade*.62)))")

          # Late checkout: integer impacts and softer penalties.
          text=text.replace("impact:'👑 +'+fmtImpact(p.lateGain)+' · 🏢 -1 · 🧹 翻房更紧'","impact:'👑 +'+repReward(p.lateGain)+' · 🏢 -1 · 🧹 翻房更紧'")
          text=text.replace("impact:'👑 -'+fmtImpact(p.lateDeny)+' · 🏢 +1'","impact:'👑 -'+repPenalty(p.lateDeny)+' · 🏢 +1'")
          text=text.replace("impact:'🎁 -1 · 👑 +'+fmtImpact(Math.max(.8,p.lateGain))+' · 🏢 ±0'","impact:'🎁 -1 · 👑 +'+repReward(Math.max(1,p.lateGain))+' · 🏢 ±0'")
          text=text.replace("state.rep=Math.min(100,state.rep+p.lateGain);state.owner=Math.max(0,state.owner-1)","changeRep(repReward(p.lateGain));changeOwner(-1)")
          text=text.replace("state.rep=Math.max(0,state.rep-p.lateDeny);state.owner=Math.min(100,state.owner+1);gu.grudge+=p.lateDeny","changeRep(-repPenalty(p.lateDeny));changeOwner(1);gu.grudge+=repPenalty(p.lateDeny)")
          text=text.replace("state.rep=Math.min(100,state.rep+Math.max(.8,p.lateGain))","changeRep(repReward(Math.max(1,p.lateGain)))")

          # Route common one-off losses through the daily buffer.
          text=text.replace("state.stats.appStillSelling++;state.stats.complaints++;state.daily.complaints++;state.rep=Math.max(0,state.rep-1);state.daily.highlight=","state.stats.appStillSelling++;state.stats.complaints++;state.daily.complaints++;changeRep(-1);state.daily.highlight=")
          text=text.replace("state.rep=Math.max(0,state.rep-1);showToast('🕯 Audit 发现了 '+state.daily.complaints+' 个客诉。口碑 -1')","changeRep(-1);showToast('🕯 Audit 发现了 '+state.daily.complaints+' 个客诉。口碑 -1')")
          text=text.replace("state.rateBoost=1.08;state.rep=Math.max(0,state.rep-1);state.owner=Math.min(100,state.owner+2);showToast('📈 ADR +8% · 会员口碑 -1 · 业主 +2')","state.rateBoost=1.08;changeRep(-1);changeOwner(2);showToast('📈 ADR +8% · 会员口碑 -1 · 业主 +2')")

          # Day-end recovery: good operations should visibly repair reputation.
          text=text.replace("state.day++;var unlocks=unlockAnnouncement(state.day);","var repRecovery=state.daily.complaints===0?2:state.daily.complaints===1?1:0;if(repRecovery){changeRep(repRecovery);penalty+='\\n💬 稳定经营修复口碑 +'+repRecovery+'。'}state.day++;var unlocks=unlockAnnouncement(state.day);",1)
          text=text.replace("briefingDone:false,walks:0};for(cg=0;cg<state.guests.length;cg++)","briefingDone:false,walks:0,repLoss:0};for(cg=0;cg<state.guests.length;cg++)",1)
          text=text.replace("if(state.rep<35||state.owner<35)","if(state.rep<30||state.owner<35)")
          text=text.replace("'口碑决定会员是否愿意继续把你的酒店叫“厚道”。'","'口碑采用整数档位；普通失误单次最多 -4，且每天有负面缓冲上限。'")

          # Replace simple remaining direct reputation losses with the buffered helper.
          text=re.sub(r"state\.rep=Math\.max\(0,state\.rep-([1234])\)",r"changeRep(-\1)",text)

          # Existing saves from the overly punitive version get one fair rescue, not a full reset.
          if 'balance54Applied' not in text:
              raise SystemExit('migration flag missing after patch')

          impacts=re.findall(r"impact:'([^']*)'",text)
          bad=[x for x in impacts if re.search(r'\d+\.\d+',x)]
          if bad:
              raise SystemExit('decimal impacts remain: '+repr(bad[:5]))
          if '<title>今晚有套吗？ v5.4</title>' not in text:
              raise SystemExit('version patch failed')

          p.write_text(text,encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          if len(scripts)!=1:
              raise SystemExit('unexpected script count '+str(len(scripts)))
          Path('/tmp/jinwan-v54.js').write_text(scripts[0],encoding='utf-8')
          PY
      - name: Syntax check
        run: node --check /tmp/jinwan-v54.js
      - name: Commit v5.4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/jinwan-youtao/index.html
          git commit -m "feat: rebalance Jinwan reputation economy v5.4 [skip ci]"
          git push
