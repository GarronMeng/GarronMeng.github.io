name: Patch Jinwan Youtao v5.9 quests
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v59-quests.yml'
      - 'scripts/patch_jinwan_v59.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply task and achievement system
        run: python3 scripts/patch_jinwan_v59.py
      - name: Validate game script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no script block')
          Path('/tmp/jinwan.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/jinwan.js
          grep -q "QUEST_SYSTEM_VERSION='5.9'" games/jinwan-youtao/index.html
          grep -q 'id="questSheet"' games/jinwan-youtao/index.html
          grep -q '零客诉的一天' games/jinwan-youtao/index.html
          git diff --check
      - name: Commit v5.9
        shell: bash
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then
            echo 'No game diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: add guided tasks and achievements v5.9 [skip ci]'
          git push
