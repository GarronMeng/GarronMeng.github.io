name: Patch Jinwan Youtao v5.9.2 room UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v592-room-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore v5.0.1 room scene feel
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/jinwan-youtao/index.html')
          s=p.read_text(encoding='utf-8')
          if "var QUEST_SYSTEM_VERSION='5.9.2'" in s:
              print('v5.9.2 already applied')
              raise SystemExit(0)

          old='    <div class="stagehud"><span id="occChip" hidden>入住率 0%</span><div class="viewtoggle" id="viewToggle"><button class="on" data-view="2d">2D</button><button data-view="3d">3D</button></div><span id="explorerChip" hidden>Brand Explorer 1/5</span></div>'
          new='    <div class="stagehud"><div class="stagechip" id="occChip">入住率 0%</div><div class="viewtoggle" id="viewToggle"><button class="on" data-view="2d">经典 2D</button><button data-view="3d">沉浸 3D</button></div><div class="stagechip" id="explorerChip">Brand Explorer 1/5</div></div>'
          if old not in s: raise SystemExit('stagehud target missing')
          s=s.replace(old,new,1)

          old_badge='    <button class="propertybadge" id="propertyBadge" type="button" hidden>🏨 <b id="propertyPrestige">BASIC 0/15</b><span class="dots" id="propertyDots">○○○</span></button>'
          new_badge='    <button class="propertybadge" id="propertyBadge" type="button">🏨 <b id="propertyPrestige">BASIC 0/15</b><span class="dots" id="propertyDots">○○○</span></button>'
          if old_badge not in s: raise SystemExit('property badge target missing')
          s=s.replace(old_badge,new_badge,1)

          if "var QUEST_SYSTEM_VERSION='5.9.1';" not in s: raise SystemExit('version marker missing')
          s=s.replace("var QUEST_SYSTEM_VERSION='5.9.1';","var QUEST_SYSTEM_VERSION='5.9.2';",1)

          css=(
              "/* v5.9.2 room scene: restore the richer classic 2D presentation */\n"
              ".stage:not(.mode3d){height:108vw;min-height:350px;max-height:430px}\n"
              ".stage:not(.mode3d) .stagehud{left:10px;right:10px;justify-content:space-between}\n"
              ".stage:not(.mode3d) .stagechip{display:block!important;padding:5px 7px;font-size:8.4px;background:rgba(251,248,242,.92);border:1px solid rgba(120,109,96,.22);box-shadow:0 4px 12px rgba(0,0,0,.07)}\n"
              ".stage:not(.mode3d) .viewtoggle{box-shadow:0 4px 12px rgba(0,0,0,.06);background:rgba(251,248,242,.92)}\n"
              ".stage:not(.mode3d) .viewtoggle button{padding:4px 8px;font-size:7.8px}\n"
              ".stage:not(.mode3d) .propertybadge:not(.locked){display:block!important;top:44px;left:10px;transform:none}\n"
              "@media(max-width:430px){.stage:not(.mode3d){height:108vw;min-height:350px;max-height:430px}.stage:not(.mode3d) .propertybadge:not(.locked){top:42px;transform:scale(.96);transform-origin:left top}}\n"
          )
          if '</style>' not in s: raise SystemExit('style close missing')
          s=s.replace('</style>',css+'\n</style>',1)

          assert 'id="questSheet"' in s
          assert 'grid-template-columns:repeat(4,1fr)' in s
          assert '经典 2D' in s and '沉浸 3D' in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate game script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          m=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('inline script missing')
          Path('/tmp/game.js').write_text(m[-1],encoding='utf-8')
          assert "QUEST_SYSTEM_VERSION='5.9.2'" in s
          assert '<div class="stagechip" id="occChip">' in s
          assert '<div class="stagechip" id="explorerChip">' in s
          assert 'id="propertyBadge" type="button">' in s
          PY
          node --check /tmp/game.js
      - name: Commit v5.9.2
        shell: bash
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'fix: restore classic room scene feel v5.9.2 [skip ci]'
          git push origin master