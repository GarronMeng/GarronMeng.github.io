name: Patch Jinwan Youtao v5.9.3 room interaction
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v593-room-interaction.yml'
      - '.github/scripts/patch-jinwan-v593-room-interaction.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch room interaction
        run: python3 .github/scripts/patch-jinwan-v593-room-interaction.py
      - name: Validate game script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          assert "QUEST_SYSTEM_VERSION='5.9.3'" in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('inline script missing')
          Path('/tmp/game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v5.9.3
        shell: bash
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'fix: contextual room interactions v5.9.3 [skip ci]'
          git push origin master