name: Patch Jinwan Youtao v5.9.4 room experience
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v594-room-experience.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch room experience
        run: python3 games/jinwan-youtao/patch_v594.py
      - name: Validate game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          assert "QUEST_SYSTEM_VERSION='5.9.4'" in s
          assert "'roomSheet'" in s[s.find('function closeSheets'):s.find('function toggleSheet')]
          assert 'id="roomPreviewCanvas"' in s
          assert 'CURRENT GUEST · 当前入住' in s
          assert 'function drawMiniInterior' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v5.9.4
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'fix: room detail actions and interior sprites v5.9.4 [skip ci]'
          git push origin master
