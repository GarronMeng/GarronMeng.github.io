name: Patch Jinwan Youtao v5.9.5 room and event UX
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v595-room-events.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch room and event UX
        run: python3 games/jinwan-youtao/patch_v595.py
      - name: Validate game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          assert "QUEST_SYSTEM_VERSION='5.9.5'" in s
          assert 'function showMaintenanceDecision' in s
          assert '工程事故 · 可售房突发停用' in s
          assert '今晚少 1 间可卖房' in s
          assert 'CURRENT GUEST · 当前入住' in s
          assert 'data-room-action="water"' in s
          assert 'Touch-first fallback' in s
          assert 'function drawMiniInterior' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v5.9.5
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'fix: clearer room operations and events v5.9.5 [skip ci]'
          git push origin master
