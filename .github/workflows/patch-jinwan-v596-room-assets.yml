name: Patch Jinwan Youtao v5.9.6 room assets and mobile UI
'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v596-room-assets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Patch v5.9.6
        run: python3 games/jinwan-youtao/patch_v596.py
      - name: Validate game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text(encoding='utf-8')
          assert "QUEST_SYSTEM_VERSION='5.9.6'" in s
          assert 'var roomRenderData=' in s
          assert 'data:image/png;base64,' in s
          assert 'roomRenderImages[r.type]' in s
          assert 'overflow-wrap:anywhere' in s
          assert '#explorerChip{position:absolute' in s
          assert 'Explorer 1/5' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit v5.9.6
        run: |
          if git diff --quiet -- games/jinwan-youtao/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html
          git commit -m 'fix: room renders and mobile UI v5.9.6 [skip ci]'
          git push origin master
