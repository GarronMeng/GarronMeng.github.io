name: Patch Jinwan v6.0.1 cutaway
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v601-kairo-cutaway.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games/jinwan-youtao/index.html')
          s=p.read_text()
          css='''<style id="v601-cutaway-css">
#propertyBadge,#explorerChip{display:none!important}
.stage{height:132vw;min-height:470px;max-height:590px;background:linear-gradient(180deg,#6783a0 0%,#3f5770 20%,#26384b 20.5%,#1e2d3e 100%)}
.stagehud{top:10px;left:12px;right:12px;justify-content:flex-start;align-items:center}
#occChip{border-radius:16px;padding:7px 10px;background:rgba(252,248,240,.96);font-size:10px;box-shadow:0 4px 12px rgba(0,0,0,.10)}
#viewToggle{position:absolute;left:50%;top:0;transform:translateX(-50%);background:rgba(252,248,240,.96);padding:4px}
#viewToggle button{font-size:9px;padding:4px 9px}
.hint{bottom:8px;left:12px;right:12px;background:#fff8df;border-color:#e7c96f}
.bottom{padding-top:9px}.actions{grid-template-columns:repeat(4,1fr)!important}.action{height:58px;border-radius:15px}.action span{font-size:20px}
#portfolioBtn{display:none!important}.feed{border-radius:12px}
@media(max-width:380px){.stage{height:138vw;min-height:500px}.action{height:55px}}
</style>'''
          if 'id="v601-cutaway-css"' not in s:s=s.replace('</head>',css+'\n</head>')
          js='''<script id="v601-cutaway-js">
(function(){
window.roomRenderImages={};window.roomRenderData={};
window.dims=function(){var w=canvasSize.w||game.clientWidth||360,h=canvasSize.h||game.clientHeight||500;var gutter=43,m=10,lobby=80,top=58,fh=(h-top-lobby-24)/4;if(fh>102)fh=102;if(fh<80)fh=80;return{w:w,h:h,m:m,gutter:gutter,lobby:lobby,fh:fh,bw:w-gutter-m-8,base:h-32,top:top}};
window.roomRect=function(r){var d=dims(),gap=5,cw=(d.bw-gap*2)/3,y=d.base-d.lobby-(r.f+1)*d.fh;return{x:d.gutter+r.c*(cw+gap),y:y,w:cw,h:d.fh-6}};
window.lobbyRect=function(){var d=dims();return{x:d.gutter,y:d.base-d.lobby,w:d.w-d.gutter-9,h:d.lobby-5}};
function rr(c,x,y,w,h,r,fill,stroke,lw){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function line(c,x1,y1,x2,y2,col,w){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w||1;c.stroke()}
function plant(c,x,y,s){s=s||1;c.fillStyle='#6d8859';c.fillRect(x-2*s,y-8*s,2*s,8*s);c.fillRect(x+1*s,y-10*s,2*s,10*s);c.fillRect(x-5*s,y-6*s,4*s,2*s);c.fillStyle='#9a704d';c.fillRect(x-4*s,y,8*s,5*s)}
function lamp(c,x,y,s){s=s||1;c.fillStyle='#d1a44e';c.fillRect(x,y-9*s,1.5*s,10*s);c.fillStyle='#ffe5a0';c.beginPath();c.moveTo(x-5*s,y-9*s);c.lineTo(x+5*s,y-9*s);c.lineTo(x+3*s,y-4*s);c.lineTo(x-3*s,y-4*s);c.closePath();c.fill()}
function bed(c,x,y,w,h,accent){c.fillStyle='#664b39';c.fillRect(x,y,w,h);c.fillStyle='#f8f2e8';c.fillRect(x+2,y-4,w-4,h);c.fillStyle=accent;c.fillRect(x+2,y+h-5,w-4,4);c.fillStyle='#fff';c.fillRect(x+4,y-3,w*.34,4)}
function art(c,x,y,w,h,accent){c.fillStyle='#6f5745';c.fillRect(x,y,w,h);c.fillStyle=accent;c.fillRect(x+2,y+2,w-4,h-4)}
window.drawRoomSpriteInCell=function(r,q,locked){if(locked||!r.type)return false;var c=ctx,type=r.type,x=q.x+5,y=q.y+17,w=q.w-10,h=q.h-31;if(w<25||h<24)return false;c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.imageSmoothingEnabled=false;var suite=type==='suite',wall=suite?'#ead9bf':'#eddfc9',floor=suite?'#b98053':'#b88b64',accent=suite?'#b4634c':'#b9875b';rr(c,x,y,w,h,2,wall,'rgba(77,59,45,.55)',1.3);c.fillStyle=floor;c.fillRect(x,y+h*.64,w,h*.36);line(c,x,y+h*.64,x+w,y+h*.64,'rgba(75,55,42,.42)',1);c.fillStyle='rgba(255,236,173,.95)';c.fillRect(x+w*.18,y+3,6,2);c.fillRect(x+w*.70,y+3,6,2);if(type==='standard'||type==='suite'){art(c,x+w*.38,y+7,w*.24,7,suite?'#6f8e8f':'#829c9d');bed(c,x+6,y+h*.54,w*(suite ? .48 : .43),9,accent);lamp(c,x+w*.56,y+h*.60,.8);plant(c,x+w-10,y+h*.73,.8);c.fillStyle='#76543c';c.fillRect(x+w*.66,y+h*.56,w*.20,3);c.fillRect(x+w*.69,y+h*.59,1,7);c.fillRect(x+w*.82,y+h*.59,1,7);if(suite){c.fillStyle='#5f7865';c.fillRect(x+w*.58,y+h*.76,w*.28,7);c.fillStyle='#8d6648';c.fillRect(x+w*.65,y+h*.72,w*.14,2)}}else if(type==='breakfast'){c.fillStyle='#7c593e';c.fillRect(x+5,y+10,w-10,7);c.fillStyle='#d6ac61';c.fillRect(x+8,y+6,w*.26,4);c.fillStyle='#303e44';c.fillRect(x+w*.72,y+5,7,8);for(var i=0;i<3;i++){var tx=x+8+i*(w-18)/3;c.fillStyle='#7c593e';c.fillRect(tx,y+h*.73,13,3);c.fillRect(tx+2,y+h*.76,1,6);c.fillRect(tx+10,y+h*.76,1,6)}plant(c,x+w-10,y+h*.72,.7)}else if(type==='club'){c.fillStyle='#5b765f';c.fillRect(x+5,y+h*.58,w*.36,8);c.fillStyle='#7a563f';c.fillRect(x+w*.49,y+8,w*.40,5);for(var b=0;b<4;b++){c.fillStyle=b%2?'#c78b48':'#7c3e35';c.fillRect(x+w*.53+b*8,y+10,3,4)}plant(c,x+w-9,y+h*.74,.8)}else if(type==='gym'){c.fillStyle='#4e5960';c.fillRect(x+7,y+h*.69,w*.32,3);line(c,x+10,y+h*.67,x+15,y+h*.44,'#4e5960',2);line(c,x+w*.58,y+h*.71,x+w*.82,y+h*.71,'#4e5960',2);c.fillStyle='#6f8795';c.fillRect(x+w*.50,y+h*.46,w*.38,3);plant(c,x+w-9,y+h*.75,.7)}else if(type==='spa'){c.fillStyle='#f3eadc';c.fillRect(x+6,y+h*.59,w*.48,8);c.fillStyle='#a68261';c.fillRect(x+6,y+h*.67,w*.48,3);c.fillStyle='#c5ad89';c.fillRect(x+w*.63,y+h*.35,w*.24,h*.36);lamp(c,x+w*.58,y+h*.61,.7);plant(c,x+w-9,y+h*.74,.8)}c.fillStyle='rgba(255,255,255,.13)';c.fillRect(x+2,y+2,w-4,3);c.restore();return true};
var baseDraw=window.draw;window.draw=function(){baseDraw();if(state.visualMode==='3d')return;var d=dims(),c=ctx;c.save();c.fillStyle='#1f3042';c.fillRect(0,d.top-7,d.gutter-4,d.base-d.top+12);for(var f=0;f<4;f++){var yy=d.base-d.lobby-(f+1)*d.fh;c.fillStyle='rgba(255,255,255,.92)';c.font='900 10px -apple-system,sans-serif';c.textAlign='center';c.fillText((f+2)+'F',20,yy+24);c.font='800 7px -apple-system,sans-serif';c.fillStyle='rgba(255,255,255,.72)';c.fillText(roomUnlocked({f:f})?'客房':'尚未开放',20,yy+37);if(!roomUnlocked({f:f})){c.fillStyle='rgba(255,255,255,.55)';c.font='12px sans-serif';c.fillText('🔒',20,yy+55)}}var l=lobbyRect();c.fillStyle='rgba(255,255,255,.95)';c.font='900 10px -apple-system,sans-serif';c.fillText('大堂',20,l.y+29);c.font='800 7px -apple-system,sans-serif';c.fillStyle='rgba(255,255,255,.72)';c.fillText('LOBBY',20,l.y+42);c.strokeStyle='#1a2938';c.lineWidth=4;for(var ff=0;ff<4;ff++){var ry=d.base-d.lobby-(ff+1)*d.fh-2;c.beginPath();c.moveTo(d.gutter-2,ry);c.lineTo(d.w-7,ry);c.stroke()}c.restore()};
window.QUEST_SYSTEM_VERSION='6.0.1';
})();
</script>'''
          if 'id="v601-cutaway-js"' not in s:s=s.replace('</body>',js+'\n</body>')
          p.write_text(s)
          PY
      - name: Verify JS
        run: |
          grep -q 'v601-cutaway-js' games/jinwan-youtao/index.html
          python - <<'PY'
          import re,pathlib,tempfile,subprocess,os
          s=pathlib.Path('games/jinwan-youtao/index.html').read_text()
          js='\n'.join(re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s))
          f=tempfile.NamedTemporaryFile(delete=False,suffix='.js',mode='w');f.write(js);f.close()
          r=subprocess.run(['node','--check',f.name],capture_output=True,text=True);os.unlink(f.name)
          print(r.stderr);assert r.returncode==0
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: Hyatt cutaway board v6.0.1 [skip ci]' || exit 0
          git push
