.v65-frontdesk{position:absolute;z-index:5;left:18%;right:16%;bottom:25px;height:42px;background:linear-gradient(180deg,#815a42,#51392d);clip-path:polygon(3% 0,97% 0,92% 100%,8% 100%);box-shadow:0 6px 10px rgba(50,34,25,.26)}.v65-frontdesk:before{content:"";position:absolute;left:6%;right:6%;top:5px;height:2px;background:#d0ab68;box-shadow:0 24px 0 rgba(41,31,25,.25)}
.v65-staff{position:absolute;z-index:8;bottom:49px;width:14px;height:24px;border-radius:5px 5px 2px 2px;background:#183b5d}.v65-staff:before{content:"";position:absolute;left:2px;top:-10px;width:10px;height:10px;border-radius:50%;background:#e8c6aa;box-shadow:0 -3px 0 #26211d}.v65-s1{left:36%}.v65-s2{left:58%}
