name: Patch Jinwan v6.5 true 3D tower and floor scroll
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v65-true3d-scroll.yml'
      - 'games/jinwan-youtao/patch_v65.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch source
        run: python games/jinwan-youtao/patch_v65.py
      - name: Validate source
        run: |
          grep -q "QUEST_SYSTEM_VERSION='6.5.0'" games/jinwan-youtao/index.html
          grep -q 'id="v65-true3d-css"' games/jinwan-youtao/index.html
          grep -q 'id="v65-true3d-js"' games/jinwan-youtao/index.html
          grep -q 'function floorRenderCount()' games/jinwan-youtao/index.html
          grep -q 'for(f=0;f<7;f++)' games/jinwan-youtao/index.html
          grep -q 'v65-scroller' games/jinwan-youtao/index.html
          python - <<'PY'
          import re, pathlib, subprocess, tempfile, os
          s=pathlib.Path('games/jinwan-youtao/index.html').read_text()
          js='\n'.join(re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',s))
          f=tempfile.NamedTemporaryFile(delete=False,suffix='.js',mode='w');f.write(js);f.close()
          r=subprocess.run(['node','--check',f.name],capture_output=True,text=True);os.unlink(f.name)
          print(r.stderr)
          assert r.returncode==0
          PY
      - name: Commit v6.5
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: interactive cutaway tower v6.5 [skip ci]' || exit 0
          git push
