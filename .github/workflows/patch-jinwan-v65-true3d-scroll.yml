.v65-art{position:absolute;z-index:1;right:12px;top:15px;width:27px;height:11px;background:linear-gradient(135deg,var(--v65-accent),#d9c6a8);border:3px solid #655343;box-shadow:0 2px 3px rgba(0,0,0,.12)}
.v65-bed{position:absolute;z-index:3;left:13px;bottom:21px;width:53px;height:22px;border-radius:2px;background:linear-gradient(180deg,#fffdf8 0 42%,#ece4da 43% 100%);box-shadow:0 4px 0 #5b4437,0 6px 8px rgba(46,31,23,.22)}.v65-bed:before{content:"";position:absolute;left:0;right:0;top:-9px;height:12px;background:#7d5a45;border-radius:2px 2px 0 0}.v65-bed:after{content:"";position:absolute;left:4px;right:4px;bottom:2px;height:6px;background:var(--v65-soft);border-radius:1px;box-shadow:inset 0 1px rgba(255,255,255,.28)}
