.v65-room.breakfast .v65-bed,.v65-room.breakfast .v65-pillow,.v65-room.breakfast .v65-desk,.v65-room.breakfast .v65-chair,.v65-room.breakfast .v65-lamp{display:none}.v65-room.breakfast:before{background:#b18460}.v65-buffet{position:absolute;z-index:3;left:8px;right:8px;bottom:24px;height:18px;background:linear-gradient(180deg,#7e553b,#5b3e30);box-shadow:0 4px 0 #453229}.v65-buffet:before{content:"";position:absolute;left:6px;right:6px;top:-6px;height:7px;background:repeating-linear-gradient(90deg,#d7b76d 0 12px,#b9664e 12px 24px,#d8d0a5 24px 36px);border:2px solid #6a4936}.v65-buffet:after{content:"";position:absolute;left:8px;right:8px;bottom:-13px;height:8px;background:repeating-linear-gradient(90deg,#74513d 0 9px,transparent 9px 20px)}
.v65-room.club .v65-bed,.v65-room.club .v65-pillow{display:none}.v65-room.club:before{background:#8f6f58}.v65-bar{position:absolute;z-index:3;left:7px;right:7px;bottom:24px;height:23px;background:linear-gradient(180deg,#6c4936,#493225);box-shadow:0 4px 0 #33251e}.v65-bar:before{content:"";position:absolute;left:3px;right:3px;top:-19px;height:17px;background:repeating-linear-gradient(90deg,#b58f50 0 3px,transparent 3px 9px),linear-gradient(#2d2622,#443228);border:2px solid #5f4434}
.v65-room.gym .v65-bed,.v65-room.gym .v65-pillow,.v65-room.gym .v65-desk,.v65-room.gym .v65-chair,.v65-room.gym .v65-lamp{display:none}.v65-room.gym{background:linear-gradient(180deg,#d8d8d3 0 55%,#8b8f8a 56%)}.v65-tread{position:absolute;z-index:4;left:10px;bottom:23px;width:35px;height:16px;border-bottom:5px solid #40484c;border-right:3px solid #40484c;transform:skewX(-10deg)}.v65-tread:before{content:"";position:absolute;right:-2px;top:-12px;width:3px;height:16px;background:#454d51;transform:skewX(10deg)}.v65-ball{position:absolute;z-index:3;right:16px;bottom:23px;width:17px;height:17px;border-radius:50%;background:#8c9a9d;box-shadow:-22px 3px 0 -2px #b08c66}
.v65-room.spa .v65-bed,.v65-room.spa .v65-pillow,.v65-room.spa .v65-desk,.v65-room.spa .v65-chair{display:none}.v65-room.spa{background:linear-gradient(180deg,#eee9df 0 56%,#a88f78 57%)}.v65-treatment{position:absolute;z-index:3;left:12px;bottom:26px;width:58px;height:14px;border-radius:7px 7px 2px 2px;background:#f7f1e8;box-shadow:0 5px 0 #765f4e}.v65-treatment:after{content:"";position:absolute;right:-21px;top:-16px;width:17px;height:30px;background:rgba(205,187,157,.72);border-radius:8px}
.v65-amenity{display:grid;grid-template-columns:44px minmax(0,1fr);height:96px}.v65-amenityrooms{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;background:#263946;border-top:4px solid #3d5465;border-bottom:4px solid #1d2c38}.v65-amenitybox{position:relative;overflow:hidden;background:linear-gradient(180deg,#eee5d7 0 55%,#a98568 56%);box-shadow:inset 0 0 0 1px rgba(78,60,48,.28)}.v65-amenitybox b{position:absolute;left:7px;top:6px;font-size:8px;z-index:4}.v65-amenitybox small{position:absolute;left:7px;top:17px;font-size:5.5px;opacity:.62;z-index:4}.v65-amenitybox .v65-bar{left:10px;right:10px}.v65-amenitybox .v65-tread{left:22px}.v65-amenitybox .v65-treatment{left:18px}
.v65-breakfastfloor{display:grid;grid-template-columns:44px 1fr;height:118px}.v65-breakfastspace{position:relative;overflow:hidden;background:linear-gradient(180deg,#efe4d3 0 47%,#aa805f 48%);border-top:4px solid #3b5161;border-bottom:4px solid #1d2c38}.v65-breakfastspace:before{content:"";position:absolute;left:16px;right:16px;bottom:22px;height:31px;background:linear-gradient(180deg,#74513c,#50372b);box-shadow:0 5px 0 #39291f}.v65-breakfastspace:after{content:"";position:absolute;left:26px;right:26px;bottom:52px;height:17px;background:repeating-linear-gradient(90deg,#d9b46e 0 15px,#b7634c 15px 29px,#d7ce9d 29px 42px);border:3px solid #674735}.v65-breakfastspace b{position:absolute;left:18px;top:13px;font-size:10px}.v65-table-dot{position:absolute;bottom:14px;width:22px;height:7px;border-radius:50%;background:#6b4d3a;box-shadow:0 6px 0 -3px #4b372d}.v65-t1{left:18%}.v65-t2{left:46%}.v65-t3{left:72%}
.v65-lobby{display:grid;grid-template-columns:44px 1fr;height:168px}.v65-lobbyspace{position:relative;overflow:hidden;background:linear-gradient(180deg,#efe6d9 0 52%,#b18e70 53%);border-top:4px solid #3c5364;border-bottom:5px solid #1d2d39}.v65-lobbyspace:before{content:"";position:absolute;left:15px;right:15px;top:15px;height:67px;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(255,255,255,.55),rgba(255,255,255,.18));border:1px solid rgba(121,101,82,.12);box-shadow:inset 0 0 26px rgba(255,244,218,.40)}
