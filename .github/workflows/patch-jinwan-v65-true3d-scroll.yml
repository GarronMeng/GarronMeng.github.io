<script id="v65-true3d-js">
(function(){
  if(window.__v65TowerReady)return;window.__v65TowerReady=true;
  var stage=$('stage'),canvas=$('game'),scene=$('scene3d');if(!stage||!canvas||!scene)return;
  var wrap=$('tower2dScroll');if(!wrap){wrap=document.createElement('div');wrap.id='tower2dScroll';canvas.parentNode.insertBefore(wrap,canvas);wrap.appendChild(canvas)}
  scene.innerHTML='';
  var scroller=document.createElement('div');scroller.className='v65-scroller';scroller.id='v65Scroller';
  var world=document.createElement('div');world.className='v65-world';world.id='v65World';scroller.appendChild(world);scene.appendChild(scroller);
  var rail=document.createElement('div');rail.className='v65-floorrail';rail.id='v65FloorRail';scene.appendChild(rail);
  var weather=document.createElement('div');weather.className='v65-weather';weather.id='v65Weather';scene.appendChild(weather);
  var scrollnote=document.createElement('div');scrollnote.className='v65-scrollnote';scrollnote.textContent='↕ 上下滑动查看整栋酒店';scene.appendChild(scrollnote);
  var lastKey='',lastFloors=-1,lastBrand='';
  function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
  function theme(){var t={place:['#153653','#eadfce','#6b4b39','#7e9ca1','#ad7d62','#647b64'],regency:['#203b52','#e8e3da','#5a493d','#758a96','#8d705e','#687b69'],grand:['#263747','#ece2d5','#554137','#6a7d88','#8f604e','#5f735f'],andaz:['#3f3445','#ede6dd','#55443b','#8c7186','#ae6c57','#647765'],alila:['#344b49','#e8e2d7','#594b40','#7c8c82','#927b67','#667b64'],park:['#263746','#ede8e1','#4e433c','#6b7d85','#816b60','#5d715f']};return t[state.brand]||t.place}
  function applyTheme(){var a=theme();world.style.setProperty('--v65-navy',a[0]);world.style.setProperty('--v65-wall',a[1]);world.style.setProperty('--v65-wood',a[2]);world.style.setProperty('--v65-accent',a[3]);world.style.setProperty('--v65-soft',a[4]);world.style.setProperty('--v65-green',a[5])}
  function roomStatus(r){if(!r.type)return['empty','EMPTY'];if(r.reserved)return['reserved','SUA'];if(r.occupied)return['occupied','IN HOUSE'];if(r.dirty)return['dirty',r.cleaning>0?'CLEANING':'DIRTY'];return['available',r.type==='standard'||r.type==='suite'?'AVAILABLE':'OPEN']}
  function furniture(type){if(!type)return'';if(type==='breakfast')return'<i class="v65-window"></i><i class="v65-art"></i><i class="v65-buffet"></i><i class="v65-plant"></i>';if(type==='club')return'<i class="v65-window"></i><i class="v65-bar"></i><i class="v65-plant"></i>';if(type==='gym')return'<i class="v65-window"></i><i class="v65-tread"></i><i class="v65-ball"></i><i class="v65-plant"></i>';if(type==='spa')return'<i class="v65-window"></i><i class="v65-treatment"></i><i class="v65-lamp"></i><i class="v65-plant"></i>';return'<i class="v65-window"></i><i class="v65-art"></i><i class="v65-bed"></i><i class="v65-pillow"></i><i class="v65-desk"></i><i class="v65-chair"></i><i class="v65-lamp"></i><i class="v65-plant"></i><i class="v65-sofa"></i>'}
  function roomHtml(r,idx){var st=roomStatus(r),gu=roomGuest(r),thought=gu?guestThought(gu):'',variant=((r.f||0)*3+(r.c||0))%4,code=roomCode(r),type=r.type||'empty',bubble='';if(thought){thought=String(thought);if(thought.length>8)thought=thought.slice(0,8)+'…';bubble='<span class="v65-thought">'+esc(thought)+'</span>'}return'<button class="v65-room '+type+' '+st[0]+' v65-v'+variant+'" data-v65-room="'+idx+'" type="button"><b class="v65-roomno">'+code+'</b>'+furniture(r.type)+(gu?'<i class="v65-avatar"></i>':'')+bubble+'<span class="v65-state">'+st[1]+'</span></button>'}
  function floorHtml(f){var arr=[],i;for(i=0;i<state.rooms.length;i++)if(state.rooms[i].f===f)arr.push({r:state.rooms[i],i:i});arr.sort(function(a,b){return a.r.c-b.r.c});var h='';for(i=0;i<arr.length;i++)h+=roomHtml(arr[i].r,arr[i].i);return'<section class="v65-floor" data-v65-floor="'+(f+2)+'"><div class="v65-floorlabel"><b>'+(f+2)+'F</b><span>客房</span><small>GUEST ROOMS</small></div><div class="v65-floorrooms">'+h+'</div></section>'}
  function amenityBox(kind,title,sub){var inside=kind==='gym'?'<i class="v65-tread"></i><i class="v65-ball"></i>':kind==='spa'?'<i class="v65-treatment"></i>':'<i class="v65-bar"></i>';return'<div class="v65-amenitybox"><b>'+title+'</b><small>'+sub+'</small>'+inside+'<i class="v65-plant"></i></div>'}
  function amenityRows(){var rank=maxOpenedBrandRank(),h='';if(rank>=3){h+='<section class="v65-amenity" data-v65-floor="W"><div class="v65-floorlabel"><b>康体</b><span>WELLNESS</span></div><div class="v65-amenityrooms">'+amenityBox('gym','健身房','GYM')+amenityBox('spa','休闲区','WELLNESS')+'</div></section>'}if(rank>=2){h+='<section class="v65-amenity" data-v65-floor="C"><div class="v65-floorlabel"><b>酒廊</b><span>CLUB</span></div><div class="v65-amenityrooms">'+amenityBox('club','行政酒廊','CLUB LOUNGE')+amenityBox('club','社交吧','SOCIAL BAR')+'</div></section>'}return h}
  function rooftop(){return'<section class="v65-roof" data-v65-floor="RF"><i class="v65-umbrella v65-u1"></i><i class="v65-umbrella v65-u2"></i><i class="v65-roofplant v65-p1"></i><i class="v65-roofplant v65-p2"></i></section>'}
  function breakfast(){return'<section class="v65-breakfastfloor" data-v65-floor="1"><div class="v65-floorlabel"><b>1F</b><span>餐饮</span><small>BREAKFAST</small></div><div class="v65-breakfastspace"><b>早餐厅 · '+esc(brand().short)+'</b><i class="v65-table-dot v65-t1"></i><i class="v65-table-dot v65-t2"></i><i class="v65-table-dot v65-t3"></i></div></section>'}
  function lobby(){return'<section class="v65-lobby" data-v65-floor="L"><div class="v65-floorlabel"><b>大堂</b><span>LOBBY</span></div><div class="v65-lobbyspace"><div class="v65-lobbybrand">'+esc(brand().short.toUpperCase())+'</div><div class="v65-frontdesk"></div><i class="v65-staff v65-s1"></i><i class="v65-staff v65-s2"></i><i class="v65-luggage"></i></div></section>'}
  function brandTower(){var b=brand();return'<aside class="v65-brandtower"><div class="v65-brandmark"></div><strong>'+esc(b.short.toUpperCase())+'</strong><small>'+esc(propertyPrestigeLabel())+'<br>'+propertyTotal()+'/15 · '+(state.weather==='rain'?'Rainy':'Bright Stay')+'</small></aside>'}
  function sceneKey(){var parts=[state.brand,mapFloorCount(),state.staffFD,state.weather,propertyTotal(),state.frontQueue.length];for(var i=0;i<state.rooms.length;i++){var r=state.rooms[i];if(r.f<mapFloorCount())parts.push(r.type||'-',r.occupied?1:0,r.dirty?1:0,r.cleaning>0?1:0,r.reserved?1:0,r.guest||0)}return parts.join('|')}
  function buildRail(){var h='<button class="arrow" data-v65-jump="RF">▲</button>',f;for(f=mapFloorCount()+1;f>=2;f--)h+='<button data-v65-jump="'+f+'">'+f+'F</button>';h+='<button data-v65-jump="1">1F</button><button data-v65-jump="L">L</button><button class="arrow" data-v65-jump="L">▼</button>';rail.innerHTML=h}
  function render3D(force){var k=sceneKey();if(!force&&k===lastKey)return;var oldTop=scroller.scrollTop,wasInit=!!lastKey,fc=mapFloorCount(),h='<div class="v65-city"></div><div class="v65-tower">'+rooftop()+amenityRows(),f;for(f=fc-1;f>=0;f--)h+=floorHtml(f);h+=breakfast()+lobby()+'</div>'+brandTower();world.innerHTML=h;applyTheme();buildRail();weather.textContent=(state.weather==='rain'?'🌧️':'🌤️')+' 深圳 · '+(state.weather==='rain'?'24':'26')+'°C';lastKey=k;scene.setAttribute('data-v65-brand',state.brand);requestAnimationFrame(function(){if(!wasInit||fc!==lastFloors||state.brand!==lastBrand)scroller.scrollTop=Math.max(0,scroller.scrollHeight-scroller.clientHeight);else scroller.scrollTop=Math.min(oldTop,Math.max(0,scroller.scrollHeight-scroller.clientHeight));lastFloors=fc;lastBrand=state.brand})}
  function canvasHeight(){return 60+92+30+floorRenderCount()*86}
  function sync2D(force){var h=canvasHeight(),fc=floorRenderCount();if(canvas.style.height!==h+'px'||force){canvas.style.height=h+'px';wrap.style.setProperty('--v65-canvas-h',h+'px');resize(true);if(force||wrap.getAttribute('data-floors')!==String(fc)){wrap.setAttribute('data-floors',String(fc));requestAnimationFrame(function(){wrap.scrollTop=Math.max(0,wrap.scrollHeight-wrap.clientHeight);draw()})}}}
  world.addEventListener('click',function(e){var b=e.target.closest('[data-v65-room]');if(!b)return;var idx=parseInt(b.getAttribute('data-v65-room'),10),r=state.rooms[idx];if(r)openRoomSheet(r)});
  rail.addEventListener('click',function(e){var b=e.target.closest('[data-v65-jump]');if(!b)return;var key=b.getAttribute('data-v65-jump'),el=world.querySelector('[data-v65-floor="'+key+'"]');if(el)scroller.scrollTo({top:Math.max(0,el.offsetTop-scroller.clientHeight*.22),behavior:'smooth'})});
  var oldUpdateUI=updateUI;updateUI=function(){oldUpdateUI.apply(this,arguments);sync2D(false);render3D(false)};
  var oldApplyVisualMode=applyVisualMode;applyVisualMode=function(){oldApplyVisualMode.apply(this,arguments);render3D(false)};
  sync2D(true);render3D(true);updateUI();draw();
})();
</script>
