.v65-desk{position:absolute;z-index:3;right:9px;bottom:24px;width:29px;height:5px;background:var(--v65-wood);box-shadow:0 12px 0 -2px rgba(71,50,38,.9)}.v65-desk:before,.v65-desk:after{content:"";position:absolute;top:5px;width:3px;height:13px;background:var(--v65-wood)}.v65-desk:before{left:3px}.v65-desk:after{right:3px}
.v65-chair{position:absolute;z-index:4;right:18px;bottom:15px;width:12px;height:11px;border-radius:3px 3px 2px 2px;background:var(--v65-accent);box-shadow:0 5px 0 -3px #493b32}
.v65-lamp{position:absolute;z-index:5;right:38px;bottom:31px;width:2px;height:18px;background:#b18c50}.v65-lamp:before{content:"";position:absolute;left:-5px;top:-4px;width:12px;height:7px;background:#f1d69b;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);filter:drop-shadow(0 0 4px rgba(255,220,144,.55))}
.v65-plant{position:absolute;z-index:5;right:4px;bottom:16px;width:8px;height:8px;background:#8c6d52}.v65-plant:before,.v65-plant:after{content:"";position:absolute;bottom:6px;width:13px;height:13px;background:var(--v65-green);border-radius:70% 30% 70% 30%}.v65-plant:before{left:-7px;transform:rotate(-24deg)}.v65-plant:after{right:-7px;transform:rotate(24deg)}
.v65-sofa{display:none;position:absolute;z-index:3;right:6px;bottom:17px;width:31px;height:17px;border-radius:6px 6px 3px 3px;background:var(--v65-accent);box-shadow:0 4px 0 #55443a}.v65-room.suite .v65-sofa{display:block}.v65-room.suite .v65-desk,.v65-room.suite .v65-chair{display:none}.v65-room.suite .v65-bed{width:48px}
.v65-v1 .v65-window{left:auto;right:8px}.v65-v1 .v65-art{right:auto;left:14px}.v65-v2 .v65-bed{left:8px}.v65-v2 .v65-desk{right:5px}.v65-v3 .v65-window{width:38px}.v65-v3 .v65-art{right:7px}
.v65-state{position:absolute;z-index:10;left:5px;right:5px;bottom:4px;height:13px;border-radius:3px;background:var(--status);display:flex;align-items:center;justify-content:center;font-size:6.4px;font-weight:950;letter-spacing:.2px;color:#173022;box-shadow:0 1px 3px rgba(0,0,0,.18)}.v65-room.occupied .v65-state{color:#3f3118}.v65-room.dirty .v65-state{color:#173044}.v65-room.empty .v65-state{background:rgba(77,75,72,.55);color:#fff}
.v65-avatar{position:absolute;z-index:9;left:62%;bottom:17px;width:13px;height:22px;border-radius:5px 5px 3px 3px;background:#2e4b66;box-shadow:0 2px 4px rgba(0,0,0,.22)}.v65-avatar:before{content:"";position:absolute;left:2px;top:-10px;width:9px;height:9px;border-radius:50%;background:#e7c2a4;box-shadow:0 -3px 0 #2c241f}.v65-avatar:after{content:"";position:absolute;left:3px;bottom:-5px;width:2px;height:6px;background:#403833;box-shadow:5px 0 0 #403833}
