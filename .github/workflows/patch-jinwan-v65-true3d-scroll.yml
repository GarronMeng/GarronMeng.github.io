name: Patch Jinwan v6.5 true 3D tower and floor scroll
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-jinwan-v65-true3d-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch v6.5 architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('games/jinwan-youtao/index.html')
          s=p.read_text()

          # Remove a failed temporary base64 source artifact if present in checkout later.
          # The v6.5 final scene is DOM/CSS-native so it remains interactive and scalable.

          old="function freshRooms(){var a=[],f,c;for(f=0;f<4;f++){for(c=0;c<3;c++)a.push({f:f,c:c,type:null,occupied:false,dirty:false,cleaning:0,reserved:false,guest:null})}a[0].type='breakfast';a[1].type='standard';a[2].type='standard';a[3].type='standard';a[4].type='suite';return a}"
          new="function freshRooms(){var a=[],f,c;for(f=0;f<7;f++){for(c=0;c<3;c++)a.push({f:f,c:c,type:null,occupied:false,dirty:false,cleaning:0,reserved:false,guest:null})}a[0].type='breakfast';a[1].type='standard';a[2].type='standard';a[3].type='standard';a[4].type='suite';return a}"
          if old in s:s=s.replace(old,new)

          old="base.rooms=(s.rooms&&s.rooms.length===12)?s.rooms:freshRooms();"
          new="var oldRooms=(s.rooms&&Array.isArray(s.rooms))?s.rooms:[],nextRooms=freshRooms(),oi,ni;for(oi=0;oi<oldRooms.length;oi++){for(ni=0;ni<nextRooms.length;ni++){if(nextRooms[ni].f===oldRooms[oi].f&&nextRooms[ni].c===oldRooms[oi].c){nextRooms[ni]=Object.assign(nextRooms[ni],oldRooms[oi]);break}}}base.rooms=nextRooms;"
          if old in s:s=s.replace(old,new)

          old="function mapFloorCount(){var r=maxOpenedBrandRank();return r>=2?4:r>=1?3:2}\nfunction roomUnlocked(r){return r.f<mapFloorCount()}"
          new="function mapFloorCount(){return Math.min(7,2+maxOpenedBrandRank())}\nfunction floorRenderCount(){return Math.max(4,mapFloorCount())}\nfunction roomUnlocked(r){return r.f<mapFloorCount()}"
          if old in s:s=s.replace(old,new)

          old="function dims(){var w=canvasSize.w||canvas.clientWidth||360,h=canvasSize.h||canvas.clientHeight||500,m=48,lobby=92,top=60,fh=(h-top-lobby-24)/4;if(fh>102)fh=102;if(fh<82)fh=82;return{w:w,h:h,m:m,lobby:lobby,fh:fh,bw:w-m-10,base:h-30,top:top}}"
          new="function dims(){var w=canvasSize.w||canvas.clientWidth||360,h=canvasSize.h||canvas.clientHeight||500,m=48,lobby=92,top=60,fh=86;return{w:w,h:h,m:m,lobby:lobby,fh:fh,bw:w-m-10,base:h-30,top:top}}"
          if old in s:s=s.replace(old,new)

          s=s.replace("for(var ff=0;ff<4;ff++){var fy=", "for(var ff=0;ff<floorRenderCount();ff++){var fy=")
          s=s.replace("QUEST_SYSTEM_VERSION='6.4.0'","QUEST_SYSTEM_VERSION='6.5.0'")

          css=r'''
<style id="v65-true3d-css">
/* v6.5 — generated-reference composition rebuilt as a real interactive DOM tower. */
#tower2dScroll{position:absolute;inset:0;z-index:2;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;background:transparent}
#tower2dScroll::-webkit-scrollbar,.v65-scroller::-webkit-scrollbar{display:none}
#tower2dScroll #game{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:100%!important;height:var(--v65-canvas-h,610px)!important;display:block}
.stage.mode3d #tower2dScroll{opacity:0;pointer-events:none}
.stage:not(.mode3d) #tower2dScroll{opacity:1;pointer-events:auto}
.stage.mode3d #people3d{display:none!important}
.stage.mode3d .scene3d{background-image:none!important;background:#17334d!important;overflow:hidden!important;transform:none!important;filter:none!important}
.v65-scroller{position:absolute;inset:0;z-index:1;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;background:linear-gradient(180deg,#5e86a6 0%,#a9bfcb 29%,#d9c2a7 70%,#c6a984 100%)}
.v65-world{--v65-navy:#153653;--v65-wall:#eadfce;--v65-wood:#6b4b39;--v65-accent:#7e9ca1;--v65-soft:#a8745d;--v65-green:#647b64;position:relative;min-height:100%;padding:62px 8px 72px;background:linear-gradient(180deg,rgba(35,70,99,.05),rgba(255,236,206,.10));isolation:isolate}
.v65-world:before{content:"";position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 76px 100px,rgba(255,221,147,.72) 0 2px,transparent 3px),radial-gradient(circle at 315px 145px,rgba(255,230,169,.50) 0 2px,transparent 3px),linear-gradient(180deg,rgba(20,49,75,.04),rgba(28,53,70,.24))}
.v65-city{position:absolute;z-index:-2;left:0;right:0;top:180px;bottom:0;opacity:.52;background:repeating-linear-gradient(90deg,transparent 0 20px,rgba(36,57,72,.36) 21px 44px,transparent 45px 64px),linear-gradient(180deg,transparent 0 48%,rgba(29,49,62,.36) 48% 100%);clip-path:polygon(0 30%,7% 25%,12% 42%,18% 20%,23% 39%,31% 28%,36% 45%,44% 18%,51% 35%,59% 25%,66% 41%,72% 22%,81% 35%,89% 15%,96% 31%,100% 26%,100% 100%,0 100%)}
.v65-tower{position:relative;width:100%;filter:drop-shadow(0 18px 25px rgba(17,30,40,.30));}
.v65-roof{position:relative;margin-left:44px;height:108px;border:1px solid rgba(255,255,255,.30);border-bottom:5px solid #344b5d;background:linear-gradient(180deg,rgba(120,152,169,.24),rgba(210,197,173,.42));overflow:hidden}
.v65-roof:before{content:"";position:absolute;left:8px;right:8px;bottom:8px;height:46px;background:linear-gradient(180deg,#cdb48f,#9b7c61);clip-path:polygon(0 32%,100% 0,100% 100%,0 100%);box-shadow:inset 0 2px 0 rgba(255,244,211,.55)}
.v65-roof:after{content:"";position:absolute;left:28px;right:30px;bottom:20px;height:22px;background:repeating-linear-gradient(90deg,#f3ead9 0 24px,transparent 24px 41px);opacity:.94;transform:skewX(-12deg)}
.v65-umbrella{position:absolute;z-index:3;top:19px;width:2px;height:42px;background:#7b684f}.v65-umbrella:before{content:"";position:absolute;left:-25px;top:-2px;width:50px;height:15px;background:#f5efe5;clip-path:polygon(50% 0,100% 80%,50% 64%,0 80%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}.v65-u1{left:28%}.v65-u2{left:62%}
.v65-roofplant{position:absolute;z-index:4;bottom:16px;width:13px;height:18px;background:#7f6551;border-radius:2px}.v65-roofplant:before,.v65-roofplant:after{content:"";position:absolute;bottom:12px;width:22px;height:18px;background:#577259;border-radius:70% 30% 65% 35%}.v65-roofplant:before{left:-10px;transform:rotate(-16deg)}.v65-roofplant:after{right:-10px;transform:rotate(18deg)}.v65-p1{left:10%}.v65-p2{right:8%}
.v65-floor{display:grid;grid-template-columns:44px minmax(0,1fr);min-height:112px;position:relative}
.v65-floorlabel{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--v65-navy),#102c46);color:#fff;border-top:1px solid rgba(255,255,255,.11);border-bottom:1px solid rgba(0,0,0,.30);text-align:center}.v65-floorlabel b{font-size:14px;line-height:1}.v65-floorlabel span{margin-top:6px;font-size:8px;font-weight:900}.v65-floorlabel small{font-size:5.8px;margin-top:3px;opacity:.68;letter-spacing:.3px}
.v65-floorrooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:4px 4px 5px;background:#243746;border-top:4px solid #3a5162;border-bottom:4px solid #1d2c38;box-shadow:inset 0 1px rgba(255,255,255,.16)}
.v65-room{--status:#6abf7c;position:relative;min-width:0;height:99px;padding:0;border:0;border-radius:1px;overflow:hidden;background:linear-gradient(180deg,#f4eddf 0 55%,#b88b68 56% 100%);box-shadow:inset 0 0 0 1px rgba(90,68,51,.32),inset 0 8px 13px rgba(255,248,228,.30);color:#342c26;text-align:left}
.v65-room:before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;background:linear-gradient(160deg,#caa27c,#9e7659);clip-path:polygon(0 18%,100% 0,94% 100%,6% 100%);z-index:0}
.v65-room:after{content:"";position:absolute;left:7%;right:7%;bottom:3px;height:8px;background:rgba(34,25,20,.13);filter:blur(3px);border-radius:50%;z-index:0}
.v65-room.empty{background:linear-gradient(180deg,#d9d5ce,#bbb7b1);filter:saturate(.45)}.v65-room.empty:before{background:#a9a6a1}.v65-room.dirty{--status:#74a8c8}.v65-room.reserved{--status:#d6aa58}.v65-room.occupied{--status:#e5be56}.v65-room.available{--status:#67bd7b}.v65-room.problem{--status:#c56e62}
.v65-roomno{position:absolute;z-index:8;left:6px;top:5px;font-size:10px;font-weight:950;text-shadow:0 1px rgba(255,255,255,.7)}
