name: Patch Jinwan v6.6 reference-matched UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/jinwan-youtao/patch_v66.py'
      - '.github/workflows/patch-jinwan-v66-reference-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build reference-locked tower artwork
        run: |
          mkdir -p games/jinwan-youtao/assets
          python - <<'PY'
          from pathlib import Path
          W,H=400,900
          out=[]
          A=out.append
          A('''<svg xmlns="http://www.w3.org/2000/svg" width="400" height="900" viewBox="0 0 400 900">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f99b5"/><stop offset=".42" stop-color="#a8c1cc"/><stop offset=".73" stop-color="#d7bb94"/><stop offset="1" stop-color="#8c725f"/></linearGradient>
            <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e7d8"/><stop offset="1" stop-color="#d5b68f"/></linearGradient>
            <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8ad7d"/><stop offset="1" stop-color="#9a6d4d"/></linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bad9e3"/><stop offset="1" stop-color="#63899b"/></linearGradient>
            <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#183c59"/><stop offset="1" stop-color="#092d4b"/></linearGradient>
            <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#132b3b" flood-opacity=".35"/></filter>
            <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
          </defs>
          <rect width="400" height="900" fill="url(#sky)"/>
          <circle cx="74" cy="80" r="31" fill="#f3d69a" opacity=".72"/><circle cx="74" cy="80" r="41" fill="#f3d69a" opacity=".12" filter="url(#glow)"/>
          <g opacity=".40" fill="#284659"><path d="M0 255V180h24v22h18v-46h30v53h15v-91h31v85h25v-58h35v72h17v-104h28v91h31v-67h37v82h26v-119h31v105h32v-78h25v108z"/><path d="M0 350V265h40v-50h42v72h37v-37h32v62h44v-84h36v61h32v-43h39v77h48v-66h50v93z" opacity=".45"/></g>
          <g filter="url(#shadow)">
          <path d="M12 171L384 171L372 825L24 825Z" fill="#1a3448"/>
          <path d="M18 167L380 167L369 824L28 824Z" fill="#e7dccb" stroke="#345064" stroke-width="5"/>
          <!-- rooftop / destination layer -->
          <path d="M27 165L371 165L352 104L54 104Z" fill="#b99870" stroke="#23445d" stroke-width="5"/>
          <path d="M51 104L354 104L330 78L80 78Z" fill="#d1b184"/>
          <rect x="93" y="78" width="211" height="11" rx="4" fill="#f3eadb"/>
          <g stroke="#f4efe6" stroke-width="3" fill="none" opacity=".9"><path d="M86 124h54"/><path d="M263 124h51"/></g>
          <g fill="#f3eee4" stroke="#7b6856" stroke-width="2"><path d="M105 91l-29 18h58z"/><path d="M273 91l-29 18h58z"/></g>
          <g fill="#59735e"><circle cx="66" cy="139" r="13"/><circle cx="85" cy="137" r="10"/><circle cx="325" cy="137" r="14"/><circle cx="344" cy="139" r="10"/></g>
          <rect x="58" y="147" width="294" height="13" rx="5" fill="#647e89" opacity=".75"/>
          ''')
          # room rows, perfectly aligned to the dynamic overlay percentages used by v6.6
          ys=[210,274,338,402,466,530,594]
          xs=[12,139,266]
          for row,y in enumerate(ys):
              A(f'<rect x="18" y="{y-6}" width="354" height="68" rx="2" fill="#17364f"/>')
              for col,x in enumerate(xs):
                  w=119; h=61
                  # back wall and perspective floor
                  A(f'<g transform="translate({x},{y})">')
                  A(f'<rect width="{w}" height="{h}" rx="2" fill="url(#wall)" stroke="#5c5149" stroke-width="1.3"/>')
                  A(f'<path d="M1 35 L118 32 L110 60 L8 60 Z" fill="url(#floor)"/>')
                  A('<path d="M3 6H116" stroke="#e4be65" stroke-width="1.4" opacity=".75"/>')
                  # windows vary by column
                  if col==0:
                      A('<rect x="10" y="12" width="29" height="20" fill="url(#glass)" stroke="#4e5c5e" stroke-width="3"/><path d="M24 12v20" stroke="#d9edf0"/>')
                  elif col==1:
                      A('<rect x="78" y="12" width="31" height="20" fill="url(#glass)" stroke="#4e5c5e" stroke-width="3"/><path d="M93 12v20" stroke="#d9edf0"/>')
                  else:
                      A('<rect x="10" y="12" width="30" height="20" fill="url(#glass)" stroke="#4e5c5e" stroke-width="3"/><path d="M25 12v20" stroke="#d9edf0"/>')
                  A('<rect x="50" y="15" width="24" height="8" fill="#71949b" stroke="#5b5149" stroke-width="2"/>')
                  # furniture
                  if row==0 and col==0:
                      # breakfast-ish row variation
                      A('<rect x="14" y="39" width="88" height="8" rx="2" fill="#7b5842"/><rect x="18" y="36" width="18" height="4" fill="#e7c980"/><rect x="45" y="36" width="18" height="4" fill="#e7c980"/><rect x="72" y="36" width="18" height="4" fill="#e7c980"/><path d="M23 47v10M55 47v10M84 47v10" stroke="#543d31" stroke-width="3"/>')
                  else:
                      A('<rect x="13" y="38" width="55" height="15" rx="2" fill="#f8f3e9" stroke="#735541" stroke-width="3"/><rect x="14" y="34" width="55" height="7" rx="1" fill="#815e47"/><rect x="18" y="42" width="47" height="6" fill="#b86f5d" opacity=".75"/>')
                      A('<rect x="79" y="38" width="25" height="4" fill="#614736"/><path d="M82 42v13M101 42v13" stroke="#614736" stroke-width="2"/><rect x="87" y="47" width="10" height="9" rx="2" fill="#6e9497"/>')
                      A('<path d="M72 40h3v14h-3z" fill="#ae874b"/><path d="M67 39h13l-3-7h-7z" fill="#efd69b"/>')
                  A('<rect x="108" y="47" width="6" height="11" fill="#815f49"/><circle cx="111" cy="43" r="7" fill="#607b65"/><circle cx="106" cy="45" r="5" fill="#6f8b72"/>')
                  A('</g>')
          A('''
          <!-- breakfast / restaurant -->
          <g transform="translate(18 670)"><rect width="354" height="76" rx="3" fill="#efe4d5" stroke="#17364f" stroke-width="5"/><path d="M3 42L351 38L340 73L13 73Z" fill="#b48664"/><rect x="18" y="14" width="122" height="22" fill="url(#glass)" stroke="#55707b" stroke-width="3"/><rect x="160" y="18" width="122" height="9" rx="4" fill="#805a43"/><rect x="169" y="27" width="104" height="9" rx="2" fill="#d9b26d"/><g fill="#566f5a"><circle cx="307" cy="42" r="10"/><circle cx="326" cy="39" r="13"/></g><g fill="#74523e"><rect x="53" y="51" width="48" height="5"/><rect x="198" y="49" width="48" height="5"/></g><g stroke="#5f4436" stroke-width="3"><path d="M59 55v13M95 55v13M204 53v15M240 53v15"/></g></g>
          <!-- lobby -->
          <g transform="translate(18 748)"><rect width="354" height="77" rx="3" fill="#f3eadc" stroke="#17364f" stroke-width="5"/><path d="M3 39L351 39L338 74L14 74Z" fill="#b18a68"/><rect x="27" y="48" width="145" height="12" rx="2" fill="#765b4d"/><path d="M36 60h129" stroke="#4f4038" stroke-width="5"/><rect x="216" y="49" width="91" height="17" rx="7" fill="#657e67"/><rect x="225" y="54" width="73" height="12" rx="6" fill="#d8c8ac"/><circle cx="267" cy="49" r="7" fill="#f0ddad"/><rect x="325" y="53" width="8" height="16" fill="#765946"/><circle cx="329" cy="47" r="11" fill="#60765f"/><text x="20" y="19" font-family="Arial,sans-serif" font-size="11" font-weight="900" fill="#3c3a36">FRONT DESK</text><text x="177" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="1" fill="#54758a">HYATT · SKYLINE</text></g>
          </g>
          <!-- subtle foreground depth -->
          <path d="M0 843L400 820V900H0Z" fill="#604f49" opacity=".65"/><path d="M0 860L400 838" stroke="#d8bf99" stroke-width="2" opacity=".35"/>
          </svg>''')
          svg=''.join(out)
          path=Path('games/jinwan-youtao/assets/v66_reference_tower.svg')
          path.write_text(svg,encoding='utf-8')
          assert len(svg)>15000, len(svg)
          print('tower svg chars',len(svg))
          PY
      - name: Apply v6.6 UI architecture
        run: |
          python games/jinwan-youtao/patch_v66.py
          sed -i 's/assets\/v66_reference_tower\.webp/assets\/v66_reference_tower.svg/g' games/jinwan-youtao/index.html
      - name: Validate final game
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/jinwan-youtao/index.html').read_text()
          assert "QUEST_SYSTEM_VERSION='6.6.0'" in s
          assert 'v66-reference-ui' in s and 'v66ReferenceStage' in s
          assert 'assets/v66_reference_tower.svg' in s
          assert Path('games/jinwan-youtao/assets/v66_reference_tower.svg').stat().st_size>15000
          m=re.search(r'<script id="v66-reference-ui-js">([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/v66.js').write_text(m.group(1))
          PY
          node --check /tmp/v66.js
      - name: Commit patched game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/jinwan-youtao/index.html games/jinwan-youtao/assets/v66_reference_tower.svg
          if ! git diff --cached --quiet; then
            git commit -m 'feat: reference-matched immersive UI v6.6 [skip ci]'
            git push
          fi
