name: Preview Jinwan V8 UI redesign
on:
  push:
    branches:
      - redesign/jinwan-v8-ui-hierarchy
    paths:
      - 'games/jinwan-youtao-v8/**'
      - '.github/workflows/preview-jinwan-v8-ui.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jinwan-v8-ui-preview
  cancel-in-progress: true
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch source
        uses: actions/checkout@v4
        with:
          ref: redesign/jinwan-v8-ui-hierarchy
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/games/jinwan-youtao-v8/package-lock.json
      - name: Build isolated UI preview
        working-directory: source/games/jinwan-youtao-v8
        run: |
          npm ci
          npm run build
      - name: Checkout published website
        uses: actions/checkout@v4
        with:
          ref: master
          path: published
          persist-credentials: true
      - name: Update ONLY the isolated preview path
        run: |
          mkdir -p published/games/jinwan-youtao-v8-ui-rework-preview
          rsync -a --delete source/games/jinwan-youtao-v8/dist/ published/games/jinwan-youtao-v8-ui-rework-preview/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/jinwan-youtao-v8-ui-rework-preview
          if git diff --cached --quiet; then
            echo "Preview already up to date"
            exit 0
          fi
          git commit -m "preview: publish isolated v8 UI redesign [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
