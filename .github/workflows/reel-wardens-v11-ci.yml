name: Reel Wardens v0.11 Refactor CI
on:
  push:
    branches: [reel-wardens-v11-refactor]
    paths:
      - 'reel-wardens-v11-src/**'
      - '.github/workflows/reel-wardens-v11-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: reel-wardens-v11-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript + production build
        run: npm run build
      - name: Deterministic logic smoke
        run: npm run test:logic
      - name: Install Chromium
        run: |
          # The hosted Ubuntu image can contain a Google Chrome apt source with
          # temporarily inconsistent repository metadata. Playwright does not
          # require that source. Disable the whole source file (important for
          # deb822 .sources files) before asking Playwright to install deps.
          for source_file in /etc/apt/sources.list.d/*; do
            if [ -f "$source_file" ] && grep -q 'dl.google.com/linux/chrome-stable/deb' "$source_file"; then
              sudo rm -f "$source_file"
            fi
          done
          if [ -f /etc/apt/sources.list ] && grep -q 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list; then
            sudo sed -i '\|dl.google.com/linux/chrome-stable/deb|d' /etc/apt/sources.list
          fi
          npx playwright install --with-deps chromium
      - name: Browser smoke — mobile and desktop
        run: npm test
      - name: Visual evidence — active play and battle
        run: npm run verify:visual
      - name: Upload production dist and Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-wardens-v11-evidence
          path: |
            reel-wardens-v11-src/dist
            reel-wardens-v11-src/test-results
          if-no-files-found: warn
