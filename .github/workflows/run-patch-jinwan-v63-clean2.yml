name: Run patch Jinwan v6.3 clean2
on:
  push:
    paths:
      - '.github/workflows/run-patch-jinwan-v63-clean2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v6.3 patch
        run: python tools/jinwan_v63_patch.py
      - name: Commit source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/jinwan-youtao/index.html
          git commit -m 'feat: 2.5D Hyatt visual finish v6.3 [skip ci]' || exit 0
          git push
# rerun-2
