name: V8 UI checks
on:
  pull_request:
    paths:
      - 'games/jinwan-youtao-v8/**'
      - '.github/workflows/v8-ui-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/jinwan-youtao-v8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/jinwan-youtao-v8/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
