<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>香港租房雷达</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">HK RENTAL RADAR</p>
        <h1>香港租房雷达</h1>
        <p class="sub">不追求每项满分。把通勤、空间、租金、楼龄与居住品质放在同一张表里权衡。</p>
      </div>
      <div class="refresh-box">
        <span class="pulse"></span>
        <div><strong id="refreshStatus">正在读取</strong><small id="updatedAt">—</small></div>
      </div>
    </header>

    <section class="benchmark">
      <div class="benchmark-title"><span>当前基准</span><strong>基安大厦 10C</strong></div>
      <div class="benchmark-grid">
        <div><b>HK$11,000</b><span>月租</span></div>
        <div><b>224 呎</b><span>实用面积</span></div>
        <div><b>15–18k</b><span>主要权衡区间</span></div>
        <div><b>06:30</b><span>到金钟</span></div>
      </div>
    </section>

    <section class="summary" aria-label="监控摘要">
      <div><b id="coreCount">0</b><span>A 核心盘</span></div>
      <div><b id="tradeoffCount">0</b><span>B 权衡盘</span></div>
      <div><b id="watchCount">0</b><span>重点屋苑</span></div>
      <div><b id="newCount">0</b><span>新盘 / 降价</span></div>
    </section>

    <section class="controls">
      <div class="segmented" role="tablist">
        <button class="seg active" data-view="all">全部候选</button>
        <button class="seg" data-view="core">A 核心</button>
        <button class="seg" data-view="tradeoff">B 权衡</button>
        <button class="seg" data-view="watch">重点屋苑</button>
        <button class="seg" data-view="new">新盘 / 降价</button>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-filter="area">只看 ≥300呎</button>
        <button class="chip" data-filter="rent">只看 ≤16k</button>
        <button class="chip active" data-filter="direct">直达金钟</button>
        <button class="chip active" data-filter="commute">06:30前可达</button>
        <button class="chip" data-filter="split">分体冷气已确认</button>
      </div>
    </section>

    <section class="list-head">
      <div><strong id="resultTitle">全部可权衡候选</strong><span id="resultMeta"></span></div>
      <select id="sortSelect" aria-label="排序">
        <option value="score">综合推荐</option>
        <option value="area">面积最大</option>
        <option value="rent">租金最低</option>
        <option value="fresh">最新确认</option>
      </select>
    </section>

    <section id="listings" class="listings"></section>
    <section id="empty" class="empty" hidden>
      <strong>暂时没有符合当前组合的房源</strong>
      <span>关闭部分筛选即可看到面积、租金或设备存在取舍但仍值得比较的候选。</span>
    </section>

    <footer>
      <span>A：核心匹配 · B：有明确取舍但值得看 · C：机会观察</span>
      <span>硬排除：失效盘 / 合租分间 / 学生宿舍 / 村屋 / 非住宅</span>
    </footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
