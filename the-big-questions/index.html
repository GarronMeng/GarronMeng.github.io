<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Big Questions · Loading</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f3efe7;color:#6c675f;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style></head><body><div>Loading the deep bilingual reader…</div><script>const files=Array.from({length:24},(_,i)=>'v2part'+String(i+1).padStart(2,'0')+'.txt');Promise.all(files.map(x=>fetch(x).then(r=>{if(!r.ok)throw new Error(x+' '+r.status);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(e=>{document.body.innerHTML='<div>Failed to load guide: '+e.message+'</div>'})</script></body></html>
