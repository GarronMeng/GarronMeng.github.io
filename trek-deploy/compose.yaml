services:
  handbook-build:
    build:
      context: .
      dockerfile: plugin-builder.Dockerfile
    restart: "no"
    volumes:
      - ../trek-plugins/ai-travel-handbook:/src:ro
      - ./data/plugins/ai-travel-handbook:/out

  trek:
    image: mauriceboe/trek:latest
    container_name: trek
    restart: unless-stopped
    depends_on:
      handbook-build:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TREK_PLUGINS_ENABLED: "true"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
