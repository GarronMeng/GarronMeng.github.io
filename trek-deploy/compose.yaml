services:
  trek:
    image: mauriceboe/trek:latest
    container_name: trek
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      APP_URL: ${APP_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TREK_PLUGINS_ENABLED: "true"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ../trek-plugins/ai-travel-handbook:/app/data/plugins/ai-travel-handbook:ro
