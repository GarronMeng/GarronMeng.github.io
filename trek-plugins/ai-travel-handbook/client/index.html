<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- trek:ui -->
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent}.shell{max-width:1160px;margin:auto}.hero{padding:18px;border:1px solid var(--border-primary);border-radius:18px;background:var(--bg-card);box-shadow:var(--shadow-card)}.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent)}h1{font-size:25px;margin:5px 0}.muted{font-size:12px;line-height:1.5;color:var(--text-muted)}.tabs,.daybar,.chips,.actions{display:flex;gap:6px;flex-wrap:wrap}.tabs{margin:12px 0}.tabs button,.daybar button{border:1px solid var(--border-primary);background:var(--bg-card);color:var(--text-primary);border-radius:999px;padding:8px 11px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}.tabs button.active,.daybar button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.view{display:none}.view.active{display:block}.card{border:1px solid var(--border-primary);border-radius:16px;background:var(--bg-card);box-shadow:var(--shadow-sm);overflow:hidden}.head{display:flex;justify-content:space-between;gap:8px;padding:11px 13px;border-bottom:1px solid var(--border-secondary);font-size:13px;font-weight:800}.body{padding:12px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.5fr);gap:12px}.stop{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-secondary)}.stop:last-child{border-bottom:0}.time{font-size:11px;font-weight:800;color:var(--accent)}.stop h3,.place h3{margin:0 0 4px;font-size:14px}.chip{padding:3px 7px;border-radius:999px;background:var(--accent-subtle);font-size:10px}.photo{margin-top:8px;padding:8px 9px;border-radius:10px;background:var(--accent-subtle);font-size:11px;line-height:1.5}.actions{margin-top:8px}.actions a{padding:6px 8px;border:1px solid var(--border-primary);border-radius:9px;text-decoration:none;color:var(--text-primary);font-size:10.5px;font-weight:700}.actions a.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}.mini{padding:9px 0;border-bottom:1px solid var(--border-secondary)}.mini:last-child{border-bottom:0}.mini b{font-size:12px}.mini p{margin:3px 0 0;font-size:11px;line-height:1.45;color:var(--text-muted)}.placegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.place{padding:12px;border:1px solid var(--border-primary);border-radius:14px;background:var(--bg-card)}.status{font-size:9px;font-weight:800;color:var(--accent);margin-bottom:5px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.metric{padding:14px;border:1px solid var(--border-primary);border-radius:14px;background:var(--bg-card)}.metric strong{display:block;font-size:24px}.metric span{font-size:11px;color:var(--text-muted)}.pack{padding:8px 9px;border-radius:9px;background:var(--bg-secondary);font-size:11px;margin-bottom:5px}.empty{padding:24px;text-align:center;color:var(--text-muted);font-size:12px}.error{padding:10px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-size:12px}.seed{width:100%;margin-top:10px;border:0;border-radius:10px;padding:9px;background:var(--accent);color:var(--accent-text);font-weight:800;cursor:pointer}.sync{font-size:10px;color:var(--text-faint)}@media(max-width:760px){body{padding:8px}.grid{grid-template-columns:1fr}.placegrid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.stop{grid-template-columns:46px 1fr}}
</style>
</head>
<body>
<div class="shell">
<section class="hero"><div class="kicker">AI TRAVEL HANDBOOK</div><h1 id="tripTitle">Travel Mode</h1><div class="muted" id="tripMeta">正在读取 TREK 实时行程…</div><div class="sync" id="syncState">等待同步</div></section>
<nav class="tabs"><button class="active" data-view="today">Today</button><button data-view="explore">Explore</button><button data-view="prepare">Prepare</button></nav>

<section class="view active" id="view-today">
  <section class="card"><div class="head"><span>日期</span><small id="dayLabel"></small></div><div class="body"><div class="daybar" id="daybar"></div></div></section>
  <div class="grid" style="margin-top:12px">
    <section class="card"><div class="head"><span id="todayTitle">今天怎么走</span><small>现场执行</small></div><div class="body" id="stops"></div></section>
    <aside class="card"><div class="head"><span>今日信息</span><small>来自 TREK</small></div><div class="body"><div id="todaySide"></div><button class="seed" id="seedBtn" type="button">导入 Project Bali 出片元数据</button></div></aside>
  </div>
</section>

<section class="view" id="view-explore"><section class="card"><div class="head"><span>Explore</span><small>已排 / 自由选择</small></div><div class="body"><div class="placegrid" id="places"></div></div></section></section>

<section class="view" id="view-prepare">
  <div class="metrics" id="metrics"></div>
  <div class="grid"><section class="card"><div class="head"><span>Packing</span><small>TREK 原生清单</small></div><div class="body" id="packing"></div></section><aside class="card"><div class="head"><span>预订与文件</span><small>出发前复核</small></div><div class="body" id="bookings"></div></aside></div>
</section>
</div>
<script>
let hostCtx=null,data=null,dayId=null,reloadTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const unpack=r=>{if(r==null)return r;if(typeof r==='string'){try{return JSON.parse(r)}catch{return r}}if(typeof r.body==='string'){try{return JSON.parse(r.body)}catch{return r.body}}return r.body??r};
const placeId=a=>Number(a?.place_id??a?.placeId??a?.place?.id??0);
const order=a=>Number(a?.position??a?.sort_order??a?.order??0);
const maps=p=>p?.lat!=null&&p?.lng!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p?.name||'')}`;
const xhs=p=>`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(p?.handbook?.xhs||p?.name||'')}`;
const dayName=d=>String(d?.date||d?.day_date||d?.title||`Day ${d?.id||''}`).slice(0,10);
function pmap(){return Object.fromEntries((data?.places||[]).map(p=>[Number(p.id),{...p,handbook:data?.handbook?.places?.[String(p.id)]||{}}]))}
function scheduled(){const s=new Set();for(const d of data?.days||[])for(const a of d.assignments||[])s.add(placeId(a));return s}
function rows(d){const pm=pmap();return [...(d?.assignments||[])].sort((a,b)=>order(a)-order(b)).map(a=>({a,p:pm[placeId(a)]})).filter(x=>x.p)}
function initialDay(){const today=new Date().toISOString().slice(0,10);return (data?.days||[]).find(d=>String(d.date||'').slice(0,10)===today)||(data?.days||[])[0]}
function tabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${b.dataset.view}`))})}
function renderDays(){const ds=data?.days||[];$('daybar').innerHTML=ds.map(d=>`<button data-id="${d.id}" class="${Number(d.id)===Number(dayId)?'active':''}">${esc(dayName(d))}</button>`).join('');$('daybar').querySelectorAll('button').forEach(b=>b.onclick=()=>{dayId=Number(b.dataset.id);renderDays();renderToday()})}
function renderToday(){const d=(data?.days||[]).find(x=>Number(x.id)===Number(dayId));if(!d){$('stops').innerHTML='<div class="empty">这一天还没有行程。</div>';return}const r=rows(d);$('dayLabel').textContent=dayName(d);$('todayTitle').textContent=d.title||dayName(d);$('stops').innerHTML=r.length?r.map(({a,p},i)=>{const m=p.handbook||{};return `<article class="stop"><div class="time">${esc(a.start_time||a.time||String(i+1).padStart(2,'0'))}</div><div><h3>${esc(p.name)}</h3>${p.description?`<div class="muted">${esc(p.description)}</div>`:''}<div class="chips">${m.duration?`<span class="chip">停留 ${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}${a.notes?`<span class="chip">${esc(a.notes)}</span>`:''}</div>${m.photo?`<div class="photo">出片：${esc(m.photo)}</div>`:''}<div class="actions"><a class="primary" href="${maps(p)}" target="_blank" rel="noopener">Google Maps</a><a href="${xhs(p)}" target="_blank" rel="noopener">小红书</a></div></div></article>`}).join(''):'<div class="empty">TREK Plan 里这一天还没有分配地点；拖进去后这里会实时跟着变。</div>';$('todaySide').innerHTML=`<div class="mini"><b>当天站点</b><p>${r.length} 个</p></div><div class="mini"><b>全程预订</b><p>${(data.reservations||[]).length} 条</p></div><div class="mini"><b>住宿记录</b><p>${(data.accommodations||[]).length} 条</p></div>`}
function renderExplore(){const s=scheduled(),pm=pmap();$('places').innerHTML=(data?.places||[]).map(raw=>{const p=pm[Number(raw.id)],m=p.handbook||{},on=s.has(Number(p.id));return `<article class="place"><div class="status">${on?'已排入日程':'自由选择'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.city||p.address||'')}</div><div class="chips">${m.duration?`<span class="chip">${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}</div>${m.photo?`<div class="photo">${esc(m.photo)}</div>`:''}<div class="actions"><a class="primary" href="${maps(p)}" target="_blank" rel="noopener">Maps</a><a href="${xhs(p)}" target="_blank" rel="noopener">小红书</a></div></article>`}).join('')||'<div class="empty">还没有地点。</div>'}
function renderPrepare(){const p=data?.packing||[],r=data?.reservations||[],f=data?.files||[],a=data?.accommodations||[];$('metrics').innerHTML=`<div class="metric"><strong>${p.length}</strong><span>Packing</span></div><div class="metric"><strong>${r.length}</strong><span>Reservations</span></div><div class="metric"><strong>${f.length}</strong><span>Files</span></div>`;$('packing').innerHTML=p.map(x=>`<div class="pack">${x.packed||x.done?'✓':'○'} ${esc(x.name||x.title||x.item||'Packing item')}</div>`).join('')||'<div class="empty">Packing 还没有项目。</div>';$('bookings').innerHTML=`<div class="mini"><b>住宿</b><p>${a.length} 条住宿记录</p></div>${r.slice(0,8).map(x=>`<div class="mini"><b>${esc(x.title||x.name||x.type||'Reservation')}</b><p>${esc(x.status||x.confirmation_code||'')}</p></div>`).join('')}<div class="mini"><b>附件</b><p>${f.length} 个文件</p></div>`}
function render(){const t=data?.trip||{};$('tripTitle').textContent=t.title||t.name||'Travel Mode';$('tripMeta').textContent=[t.start_date,t.end_date].filter(Boolean).join(' → ')||'TREK live trip';if(!dayId)dayId=Number(initialDay()?.id||0);renderDays();renderToday();renderExplore();renderPrepare()}
async function load(tripId,{preserveDay=true}={}){try{$('syncState').textContent='同步中…';const keep=preserveDay?dayId:null;data=unpack(await trek.invoke('/snapshot?tripId='+encodeURIComponent(tripId)));if(!data||data.error)throw new Error(data?.error||'Invalid snapshot');dayId=keep&&data.days?.some(d=>Number(d.id)===Number(keep))?keep:Number(initialDay()?.id||0);render();$('syncState').textContent='已与 TREK 同步 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){$('syncState').textContent='同步失败';$('stops').innerHTML=`<div class="error">${esc(e.message||e)}</div>`}}
$('seedBtn').onclick=async()=>{if(!hostCtx?.tripId)return;try{const r=unpack(await trek.invoke('/seed-bali-meta',{method:'POST',body:{tripId:hostCtx.tripId}}));trek.notify('success',`已匹配 ${r.seeded||0} 个 Project Bali 地点`);await load(hostCtx.tripId)}catch(e){trek.notify('error','导入失败：'+(e.message||e))}};
tabs();
trek.onContext(ctx=>{hostCtx=ctx;if(ctx.tripId)load(ctx.tripId,{preserveDay:false})});
trek.onEvent(evt=>{if(!hostCtx?.tripId)return;if(evt?.tripId&&Number(evt.tripId)!==Number(hostCtx.tripId))return;clearTimeout(reloadTimer);reloadTimer=setTimeout(()=>load(hostCtx.tripId),180)});
</script>
</body>
</html>
