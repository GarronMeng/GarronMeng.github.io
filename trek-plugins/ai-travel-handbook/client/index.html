<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- trek:ui -->
<style>
:root{--ath:#0d6b5d;--soft:color-mix(in srgb,var(--bg-card,#fff) 88%,var(--ath) 12%)}*{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:var(--text-primary,#1f2937);font-family:inherit}.shell{max-width:1180px;margin:auto}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;padding:18px;border:1px solid var(--border-primary,#ddd);border-radius:18px;background:linear-gradient(135deg,var(--soft),var(--bg-card,#fff))}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ath)}h1{font-size:25px;margin:4px 0 5px}.muted{color:var(--text-muted,#6b7280);font-size:12px;line-height:1.5}.live{display:inline-flex;gap:6px;align-items:center;font-size:10px;font-weight:800}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button,.daybar button{border:1px solid var(--border-primary,#ddd);background:var(--bg-card,#fff);color:inherit;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tabs button.active,.daybar button.active{background:var(--ath);border-color:var(--ath);color:#fff}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr);gap:12px}.card{border:1px solid var(--border-primary,#ddd);border-radius:16px;background:var(--bg-card,#fff);overflow:hidden}.head{padding:11px 13px;font-weight:900;border-bottom:1px solid var(--border-primary,#ddd);display:flex;justify-content:space-between;gap:8px}.body{padding:12px}.daybar{display:flex;gap:6px;overflow:auto;padding-bottom:3px}.daybar button{white-space:nowrap;border-radius:10px;padding:7px 9px}.stop{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--border-primary,#eee)}.stop:last-child{border-bottom:0}.stop-time{font-size:11px;font-weight:900;color:var(--ath)}.stop h3{font-size:14px;margin:0 0 4px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--soft)}.photo{margin-top:8px;padding:8px 9px;border-radius:10px;background:var(--soft);font-size:11px;line-height:1.45}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button,.action{font-size:10.5px;font-weight:800;border:1px solid var(--border-primary,#ddd);background:transparent;color:inherit;border-radius:9px;padding:7px 9px;cursor:pointer}.actions .primary,.action.primary{background:var(--ath);border-color:var(--ath);color:#fff}.mini{padding:10px 0;border-bottom:1px solid var(--border-primary,#eee)}.mini:last-child{border-bottom:0}.mini b{font-size:12px}.mini p{margin:4px 0 0;font-size:11px;color:var(--text-muted,#6b7280);line-height:1.45}.place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.place{padding:12px;border:1px solid var(--border-primary,#ddd);border-radius:14px;background:var(--bg-card,#fff)}.place h3{font-size:13px;margin:3px 0 4px}.status{font-size:9px;font-weight:900;color:var(--ath)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--border-primary,#ddd);border-radius:14px;background:var(--bg-card,#fff)}.metric strong{font-size:24px;display:block}.metric span{font-size:11px;color:var(--text-muted,#6b7280)}.packing{display:grid;gap:6px}.pack{padding:8px 9px;border-radius:10px;background:var(--soft);font-size:11px}.empty{padding:26px;text-align:center;color:var(--text-muted,#6b7280);font-size:12px}.error{padding:12px;border-radius:12px;background:var(--danger-soft,#fee2e2);color:var(--danger,#991b1b)}.toolbox{display:grid;gap:7px;margin-top:10px}.toolbox button{width:100%}.sync{font-size:10px;color:var(--text-muted,#6b7280);margin-top:7px}.alt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-primary,#ddd)}.alt-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}@media(max-width:760px){body{padding:9px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.place-grid{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr}.stop{grid-template-columns:54px 1fr}}
</style>
</head>
<body>
<div class="shell">
<section class="hero"><div><div class="eyebrow">AI TRAVEL HANDBOOK × TREK</div><h1 id="tripTitle">Travel Mode</h1><div class="muted" id="tripMeta">正在读取 TREK 行程…</div></div><div><div class="live">TREK Live Sync</div><div class="muted" id="syncText">等待行程上下文</div></div></section>
<nav class="tabs"><button data-view="today" class="active">Today</button><button data-view="explore">Explore</button><button data-view="prepare">Prepare</button></nav>
<section class="view active" id="view-today">
  <div class="card"><div class="head"><span>选择日期</span><small id="dayLabel"></small></div><div class="body"><div class="daybar" id="daybar"></div></div></div>
  <div class="grid" style="margin-top:12px">
    <section class="card"><div class="head"><span id="todayTitle">今天怎么走</span><small>Travel Mode</small></div><div class="body" id="stops"></div></section>
    <aside class="card"><div class="head"><span>今日信息</span><small>来自 TREK</small></div><div class="body"><div id="todaySide"></div><div class="toolbox" id="toolbox"></div><div class="sync" id="lastSync"></div></div></aside>
  </div>
</section>
<section class="view" id="view-explore"><div class="card"><div class="head"><span>全部地点</span><small>已排 / 备选一眼看清</small></div><div class="body"><div class="place-grid" id="places"></div></div></div></section>
<section class="view" id="view-prepare">
  <div class="summary-grid" id="metrics"></div>
  <div class="grid" style="margin-top:12px"><section class="card"><div class="head"><span>打包清单</span><small>TREK Packing</small></div><div class="body"><div class="packing" id="packing"></div></div></section><aside class="card"><div class="head"><span>预订与文件</span><small>出发前复核</small></div><div class="body" id="bookings"></div></aside></div>
</section>
</div>
<script>
let context=null,snapshot=null,selectedDayId=null,refreshTimer=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const maps=p=>p?.lat!=null&&p?.lng!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p?.name||'')}`;
const xhs=p=>`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(p?.handbook?.xhs||p?.name||'')}`;
const dateText=d=>String(d?.date||d?.day_date||d?.title||`Day ${d?.id??''}`).slice(0,10);
const placeIdOf=a=>Number(a?.place_id??a?.placeId??a?.place?.id??0),posOf=a=>Number(a?.position??a?.sort_order??a?.order??0);
function openUrl(url){try{trek.openExternal(url)}catch(_){}}
function placeMap(){return Object.fromEntries((snapshot?.places||[]).map(p=>[Number(p.id),{...p,handbook:snapshot?.handbook?.places?.[String(p.id)]||null}]))}
function assignedIds(){const out=new Set();for(const d of snapshot?.days||[])for(const a of d.assignments||[])out.add(placeIdOf(a));return out}
function dayForToday(){const today=new Date().toISOString().slice(0,10);return (snapshot?.days||[]).find(d=>dateText(d)===today)||snapshot?.days?.[0]||null}
function assignmentsFor(day){const pm=placeMap();return [...(day?.assignments||[])].sort((a,b)=>posOf(a)-posOf(b)).map(a=>({a,p:pm[placeIdOf(a)]})).filter(x=>x.p)}
function bindExternal(root=document){root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openUrl(b.dataset.open))}
function renderTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+b.dataset.view))})}
function renderDaybar(){const days=snapshot?.days||[];$('daybar').innerHTML=days.map(d=>`<button data-id="${d.id}" class="${Number(d.id)===Number(selectedDayId)?'active':''}">${esc(dateText(d))}</button>`).join('');$('daybar').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedDayId=Number(b.dataset.id);renderDaybar();renderToday()})}
function renderTimeline(day){const pm=placeMap(),meta=snapshot?.handbook?.days?.[String(day.id)]||{},timeline=Array.isArray(meta.timeline)?meta.timeline:[];if(timeline.length)return timeline.map((row,i)=>({time:row.time||String(i+1).padStart(2,'0'),text:row.text||'',p:pm[Number(row.placeId)]||null}));return assignmentsFor(day).map(({a,p},i)=>({time:a.start_time||a.time||String(i+1).padStart(2,'0'),text:a.notes||'',p}))}
function renderToday(){const day=(snapshot?.days||[]).find(d=>Number(d.id)===Number(selectedDayId));if(!day){$('stops').innerHTML='<div class="empty">这一天还没有行程。</div>';return}const rows=renderTimeline(day),meta=snapshot?.handbook?.days?.[String(day.id)]||{},pm=placeMap();$('dayLabel').textContent=dateText(day);$('todayTitle').textContent=day.title||dateText(day);$('stops').innerHTML=rows.length?rows.map(({time,text,p})=>{const m=p?.handbook||{};return `<article class="stop"><div class="stop-time">${esc(time)}</div><div><h3>${esc(p?.name||text||'行程')}</h3>${text&&p?`<div class="muted">${esc(text)}</div>`:''}<div class="chips">${m.duration?`<span class="chip">停留 ${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}</div>${m.photo?`<div class="photo">出片：${esc(m.photo)}</div>`:''}${p?`<div class="actions"><button class="primary" data-open="${esc(maps(p))}">Google Maps</button><button data-open="${esc(xhs(p))}">小红书</button></div>`:''}</div></article>`}).join(''):'<div class="empty">TREK 这一天还没有分配地点。</div>';
const alts=(meta.alternatives||[]).map(id=>pm[Number(id)]).filter(Boolean);$('todaySide').innerHTML=`${meta.summary?`<div class="mini"><b>当天逻辑</b><p>${esc(meta.summary)}</p></div>`:''}<div class="mini"><b>地点</b><p>${rows.filter(x=>x.p).length} 个执行节点</p></div><div class="mini"><b>预订</b><p>${(snapshot.reservations||[]).length} 条全程预订记录</p></div><div class="mini"><b>住宿</b><p>${(snapshot.accommodations||[]).length} 条住宿记录</p></div>${alts.length?`<div class="alt"><b>当天备选</b><div class="alt-list">${alts.map(p=>`<button class="action" data-open="${esc(maps(p))}">${esc(p.name)}</button>`).join('')}</div></div>`:''}`;bindExternal($('stops'));bindExternal($('todaySide'));renderTools()}
function renderExplore(){const scheduled=assignedIds(),pm=placeMap();$('places').innerHTML=(snapshot?.places||[]).map(raw=>{const p=pm[Number(raw.id)],m=p.handbook||{},on=scheduled.has(Number(p.id));return `<article class="place"><div class="status">${on?'已排入日程':'自由选择'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.city||p.address||'')}</div>${m.duration||m.risk?`<div class="chips">${m.duration?`<span class="chip">${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}</div>`:''}${m.photo?`<div class="photo">${esc(m.photo)}</div>`:''}<div class="actions"><button class="primary" data-open="${esc(maps(p))}">Maps</button><button data-open="${esc(xhs(p))}">小红书</button></div></article>`}).join('')||'<div class="empty">还没有地点。</div>';bindExternal($('places'))}
function renderPrepare(){const packing=snapshot?.packing||[],reservations=snapshot?.reservations||[],files=snapshot?.files||[],accom=snapshot?.accommodations||[];$('metrics').innerHTML=`<div class="metric"><strong>${packing.length}</strong><span>Packing items</span></div><div class="metric"><strong>${reservations.length}</strong><span>Reservations</span></div><div class="metric"><strong>${files.length}</strong><span>Trip files</span></div>`;$('packing').innerHTML=packing.map(x=>`<div class="pack">${x.packed||x.done?'✓':'○'} ${esc(x.name||x.title||x.item||'Packing item')}</div>`).join('')||'<div class="empty">Packing 里还没有项目。</div>';$('bookings').innerHTML=`<div class="mini"><b>住宿</b><p>${accom.length} 条</p></div>${reservations.slice(0,8).map(r=>`<div class="mini"><b>${esc(r.title||r.name||r.type||'Reservation')}</b><p>${esc(r.status||r.confirmation_code||'')}</p></div>`).join('')}<div class="mini"><b>附件</b><p>${files.length} 个文件；机票、酒店确认单统一放 TREK。</p></div>`}
function renderTools(){const empty=(snapshot?.days||[]).length===0&&(snapshot?.places||[]).length===0,imported=snapshot?.handbook?.trip?.template==='project-bali';$('toolbox').innerHTML=empty?'<button class="action primary" id="importBtn">一键导入 Project Bali</button>':`<button class="action" id="refreshBtn">立即同步 TREK</button>${imported?'<div class="muted">Project Bali 已迁移到 TREK 数据层。</div>':'<button class="action" id="metaBtn">补充 Project Bali 出片元数据</button>'}`;if($('refreshBtn'))$('refreshBtn').onclick=()=>loadTrip(context.tripId,true);if($('importBtn'))$('importBtn').onclick=importBali;if($('metaBtn'))$('metaBtn').onclick=seedMeta}
function renderAll(){const trip=snapshot.trip||{};$('tripTitle').textContent=trip.title||trip.name||'Travel Mode';$('tripMeta').textContent=[trip.start_date,trip.end_date].filter(Boolean).join(' → ')||'TREK live trip';const today=dayForToday();if(!selectedDayId&&today)selectedDayId=Number(today.id);renderDaybar();renderToday();renderExplore();renderPrepare();$('lastSync').textContent='最近同步 '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('syncText').textContent='同行人的 TREK 改动会自动刷新'}
async function loadTrip(tripId,quiet=false){if(!tripId)return;try{if(!quiet)$('tripMeta').textContent='正在从 TREK 读取实时数据…';snapshot=await trek.invoke('/snapshot?tripId='+encodeURIComponent(tripId));selectedDayId=selectedDayId&&snapshot.days?.some(d=>Number(d.id)===Number(selectedDayId))?selectedDayId:null;renderAll()}catch(err){$('tripMeta').textContent='读取失败';$('stops').innerHTML=`<div class="error">${esc(err.message||err)}</div>`}}
async function seedMeta(){try{const out=await trek.invoke('/seed-bali-meta',{method:'POST',body:{tripId:context.tripId}});trek.notify('success',`已补充 ${out.seeded||0} 个地点`);await loadTrip(context.tripId,true)}catch(e){trek.notify('error',e.message||String(e))}}
async function importBali(){const ok=await trek.confirm({title:'导入 Project Bali？',message:'会在这个空白 Trip 中创建 11 天行程、地点、地图坐标和 Travel Mode 元数据。',confirmLabel:'开始导入',cancelLabel:'取消'});if(!ok)return;try{trek.notify('info','正在导入 Project Bali…',3000);const out=await trek.invoke('/import-bali',{method:'POST',body:{tripId:context.tripId}});trek.notify('success',`完成：${out.days} 天 · ${out.places} 个地点`);selectedDayId=null;await loadTrip(context.tripId,true)}catch(e){trek.notify('error',e.message||String(e),6000)}}
function scheduleRefresh(){clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>context?.tripId&&loadTrip(context.tripId,true),350)}
renderTabs();
trek.onContext(ctx=>{const changed=!context||String(context.tripId)!==String(ctx.tripId);context=ctx;if(changed){selectedDayId=null;loadTrip(ctx.tripId)}});
window.addEventListener('message',e=>{if(e.data?.type==='trek:event'&&context?.tripId&&String(e.data.tripId)===String(context.tripId))scheduleRefresh()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&context?.tripId)loadTrip(context.tripId,true)});
setInterval(()=>{if(!document.hidden&&context?.tripId)loadTrip(context.tripId,true)},30000);
</script>
</body>
</html>
