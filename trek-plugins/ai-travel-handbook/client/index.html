<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- trek:ui -->
<style>
  :root{--ath-green:#0d6b5d;--ath-soft:color-mix(in srgb,var(--trek-surface,#fff) 88%,var(--ath-green) 12%)}
  *{box-sizing:border-box}body{margin:0;padding:14px;background:transparent;color:var(--trek-text,#1f2937);font-family:inherit}.shell{max-width:1180px;margin:auto}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;padding:18px;border:1px solid var(--trek-border,#ddd);border-radius:18px;background:linear-gradient(135deg,var(--ath-soft),var(--trek-surface,#fff))}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--ath-green)}h1{font-size:25px;margin:4px 0 5px}.muted{color:var(--trek-muted,#6b7280);font-size:12px;line-height:1.5}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--trek-border,#ddd);background:var(--trek-surface,#fff);color:inherit;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.tabs button.active{background:var(--ath-green);border-color:var(--ath-green);color:#fff}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.55fr);gap:12px}.card{border:1px solid var(--trek-border,#ddd);border-radius:16px;background:var(--trek-surface,#fff);overflow:hidden}.head{padding:11px 13px;font-weight:900;border-bottom:1px solid var(--trek-border,#ddd);display:flex;justify-content:space-between;gap:8px}.body{padding:12px}.daybar{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.daybar button{white-space:nowrap;border:1px solid var(--trek-border,#ddd);background:transparent;color:inherit;border-radius:10px;padding:7px 9px;cursor:pointer}.daybar button.active{border-color:var(--ath-green);background:var(--ath-soft)}.stop{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--trek-border,#eee)}.stop:last-child{border-bottom:0}.stop-time{font-size:11px;font-weight:900;color:var(--ath-green)}.stop h3{font-size:14px;margin:0 0 4px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--ath-soft)}.photo{margin-top:8px;padding:8px 9px;border-radius:10px;background:var(--ath-soft);font-size:11px;line-height:1.45}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions a,.actions button{font-size:10.5px;font-weight:800;text-decoration:none;border:1px solid var(--trek-border,#ddd);background:transparent;color:inherit;border-radius:9px;padding:6px 8px;cursor:pointer}.actions a.primary{background:var(--ath-green);border-color:var(--ath-green);color:#fff}.mini{padding:10px 0;border-bottom:1px solid var(--trek-border,#eee)}.mini:last-child{border-bottom:0}.mini b{font-size:12px}.mini p{margin:4px 0 0;font-size:11px;color:var(--trek-muted,#6b7280);line-height:1.45}.place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.place{padding:12px;border:1px solid var(--trek-border,#ddd);border-radius:14px;background:var(--trek-surface,#fff)}.place h3{font-size:13px;margin:0 0 4px}.status{font-size:9px;font-weight:900;color:var(--ath-green)}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:14px;border:1px solid var(--trek-border,#ddd);border-radius:14px;background:var(--trek-surface,#fff)}.metric strong{font-size:24px;display:block}.metric span{font-size:11px;color:var(--trek-muted,#6b7280)}.packing{display:grid;gap:6px}.pack{padding:8px 9px;border-radius:10px;background:var(--ath-soft);font-size:11px}.empty{padding:28px;text-align:center;color:var(--trek-muted,#6b7280);font-size:12px}.error{padding:12px;border-radius:12px;background:#fee2e2;color:#991b1b}.seed{margin-top:10px}.seed button{width:100%;border:0;background:var(--ath-green);color:#fff;border-radius:10px;padding:9px 10px;font-weight:800;cursor:pointer}@media(max-width:760px){body{padding:9px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.place-grid{grid-template-columns:1fr}.summary-grid{grid-template-columns:1fr 1fr}.stop{grid-template-columns:48px 1fr}}
</style>
</head>
<body>
<div class="shell">
  <section class="hero"><div><div class="eyebrow">AI TRAVEL HANDBOOK</div><h1 id="tripTitle">Travel Mode</h1><div class="muted" id="tripMeta">正在读取 TREK 行程…</div></div><div class="muted">TREK 负责协作与事实 · 这里负责现场执行</div></section>
  <nav class="tabs"><button data-view="today" class="active">Today</button><button data-view="explore">Explore</button><button data-view="prepare">Prepare</button></nav>

  <section class="view active" id="view-today">
    <div class="card"><div class="head"><span>选择日期</span><small id="dayLabel"></small></div><div class="body"><div class="daybar" id="daybar"></div></div></div>
    <div class="grid" style="margin-top:12px">
      <section class="card"><div class="head"><span id="todayTitle">今天怎么走</span><small>Travel Mode</small></div><div class="body" id="stops"></div></section>
      <aside class="card"><div class="head"><span>今日信息</span><small>来自 TREK</small></div><div class="body"><div id="todaySide"></div><div class="seed"><button id="seedBtn" type="button">导入 Project Bali 出片元数据</button></div></div></aside>
    </div>
  </section>

  <section class="view" id="view-explore">
    <div class="card"><div class="head"><span>全部地点</span><small>已排 / 备选一眼看清</small></div><div class="body"><div class="place-grid" id="places"></div></div></div>
  </section>

  <section class="view" id="view-prepare">
    <div class="summary-grid" id="metrics"></div>
    <div class="grid" style="margin-top:12px">
      <section class="card"><div class="head"><span>打包清单</span><small>直接读取 TREK Packing</small></div><div class="body"><div class="packing" id="packing"></div></div></section>
      <aside class="card"><div class="head"><span>预订与文件</span><small>出发前复核</small></div><div class="body" id="bookings"></div></aside>
    </div>
  </section>
</div>
<script>
let ctxState=null,snapshot=null,selectedDayId=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const unwrap=r=>{if(r==null)return r;if(typeof r==='string'){try{return JSON.parse(r)}catch{return r}}if(typeof r.body==='string'){try{return JSON.parse(r.body)}catch{return r.body}}return r.body??r};
const maps=p=>p?.lat!=null&&p?.lng!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p?.name||'')}`;
const xhs=p=>`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(p?.handbook?.xhs||p?.name||'')}`;
const dateText=d=>d?.date||d?.day_date||d?.title||`Day ${d?.id??''}`;
const placeIdOf=a=>Number(a?.place_id??a?.placeId??a?.place?.id??0);
const posOf=a=>Number(a?.position??a?.sort_order??a?.order??0);
function placeMap(){return Object.fromEntries((snapshot?.places||[]).map(p=>[Number(p.id),{...p,handbook:snapshot?.handbook?.places?.[String(p.id)]||null}]))}
function assignedIds(){const out=new Set();for(const d of snapshot?.days||[])for(const a of d.assignments||[])out.add(placeIdOf(a));return out}
function dayForToday(){const today=new Date().toISOString().slice(0,10);return (snapshot?.days||[]).find(d=>String(d.date||'').slice(0,10)===today)||snapshot?.days?.[0]||null}
function assignmentsFor(day){const pm=placeMap();return [...(day?.assignments||[])].sort((a,b)=>posOf(a)-posOf(b)).map(a=>({a,p:pm[placeIdOf(a)]})).filter(x=>x.p)}
function renderTabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+b.dataset.view))})}
function renderDaybar(){const days=snapshot?.days||[];$('daybar').innerHTML=days.map(d=>`<button data-id="${d.id}" class="${Number(d.id)===Number(selectedDayId)?'active':''}">${esc(dateText(d))}</button>`).join('');$('daybar').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedDayId=Number(b.dataset.id);renderDaybar();renderToday()})}
function renderToday(){const day=(snapshot?.days||[]).find(d=>Number(d.id)===Number(selectedDayId));if(!day){$('stops').innerHTML='<div class="empty">这一天还没有行程。</div>';return}const rows=assignmentsFor(day);$('dayLabel').textContent=dateText(day);$('todayTitle').textContent=day.title||dateText(day);if(!rows.length){$('stops').innerHTML='<div class="empty">TREK 这一天还没有分配地点。直接在 Plan 页拖入地点即可，这里会跟着更新。</div>'}else{$('stops').innerHTML=rows.map(({a,p},i)=>{const m=p.handbook||{};return `<article class="stop"><div class="stop-time">${esc(a.start_time||a.time||String(i+1).padStart(2,'0'))}</div><div><h3>${esc(p.name)}</h3>${p.description?`<div class="muted">${esc(p.description)}</div>`:''}<div class="chips">${m.duration?`<span class="chip">停留 ${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}${a.notes?`<span class="chip">${esc(a.notes)}</span>`:''}</div>${m.photo?`<div class="photo">出片：${esc(m.photo)}</div>`:''}<div class="actions"><a class="primary" href="${maps(p)}" target="_blank" rel="noopener">Google Maps</a><a href="${xhs(p)}" target="_blank" rel="noopener">小红书</a></div></div></article>`}).join('')}
const dayMeta=snapshot?.handbook?.days?.[String(day.id)];$('todaySide').innerHTML=`<div class="mini"><b>地点</b><p>${rows.length} 个已排入站点</p></div><div class="mini"><b>预订</b><p>${(snapshot.reservations||[]).length} 条全程预订记录</p></div><div class="mini"><b>住宿</b><p>${(snapshot.accommodations||[]).length} 条住宿记录</p></div>${dayMeta?`<div class="mini"><b>AI 日提示</b><p>${esc(dayMeta.summary||dayMeta.note||JSON.stringify(dayMeta))}</p></div>`:''}`}
function renderExplore(){const scheduled=assignedIds();const pm=placeMap();$('places').innerHTML=(snapshot?.places||[]).map(raw=>{const p=pm[Number(raw.id)],m=p.handbook||{},on=scheduled.has(Number(p.id));return `<article class="place"><div class="status">${on?'已排入日程':'自由选择'}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.city||p.address||'')}</div>${m.duration||m.risk?`<div class="chips">${m.duration?`<span class="chip">${esc(m.duration)}</span>`:''}${m.risk?`<span class="chip">风险 ${esc(m.risk)}</span>`:''}</div>`:''}${m.photo?`<div class="photo">${esc(m.photo)}</div>`:''}<div class="actions"><a class="primary" href="${maps(p)}" target="_blank" rel="noopener">Maps</a><a href="${xhs(p)}" target="_blank" rel="noopener">小红书</a></div></article>`}).join('')||'<div class="empty">还没有地点。</div>'}
function renderPrepare(){const packing=snapshot?.packing||[],reservations=snapshot?.reservations||[],files=snapshot?.files||[],accom=snapshot?.accommodations||[];$('metrics').innerHTML=`<div class="metric"><strong>${packing.length}</strong><span>Packing items</span></div><div class="metric"><strong>${reservations.length}</strong><span>Reservations</span></div><div class="metric"><strong>${files.length}</strong><span>Trip files</span></div>`;$('packing').innerHTML=packing.map(x=>`<div class="pack">${x.packed||x.done?'✓':'○'} ${esc(x.name||x.title||x.item||'Packing item')}</div>`).join('')||'<div class="empty">TREK Packing 里还没有项目。</div>';$('bookings').innerHTML=`<div class="mini"><b>住宿</b><p>${accom.length} 条</p></div>${reservations.slice(0,8).map(r=>`<div class="mini"><b>${esc(r.title||r.name||r.type||'Reservation')}</b><p>${esc(r.status||r.confirmation_code||'')}</p></div>`).join('')}<div class="mini"><b>附件</b><p>${files.length} 个文件；机票、酒店确认单直接放 TREK，不再散落群聊。</p></div>`}
function renderAll(){const trip=snapshot.trip||{};$('tripTitle').textContent=trip.title||trip.name||'Travel Mode';$('tripMeta').textContent=[trip.start_date,trip.end_date].filter(Boolean).join(' → ')||'TREK live trip';const today=dayForToday();if(!selectedDayId&&today)selectedDayId=Number(today.id);renderDaybar();renderToday();renderExplore();renderPrepare()}
async function loadTrip(tripId){try{$('tripMeta').textContent='正在从 TREK 读取实时数据…';const r=await trek.invoke('/snapshot?tripId='+encodeURIComponent(tripId));snapshot=unwrap(r);if(!snapshot||snapshot.error)throw new Error(snapshot?.error||'Invalid snapshot');selectedDayId=null;renderAll()}catch(err){$('tripMeta').textContent='读取失败';$('stops').innerHTML=`<div class="error">${esc(err.message||err)}</div>`}}
$('seedBtn').onclick=async()=>{if(!ctxState?.tripId)return;try{const r=unwrap(await trek.invoke('/seed-bali-meta',{method:'POST',body:{tripId:ctxState.tripId}}));trek.notify('success',`已匹配 ${r.seeded||0} 个地点的 Project Bali 元数据`);await loadTrip(ctxState.tripId)}catch(e){trek.notify('error','导入失败：'+(e.message||e))}};
renderTabs();
trek.onContext(ctx=>{ctxState=ctx;if(ctx.tripId)loadTrip(ctx.tripId)});
</script>
</body>
</html>
